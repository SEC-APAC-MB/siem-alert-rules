# =============================================================================
# Splunk SIEM Alert Rules — WSTG 01-03: Information Gathering, Configuration,
# Identity Management
# =============================================================================
# Maps OWASP WSTG-INFO, WSTG-CONF, WSTG-IDM test IDs to Splunk correlation searches
# Source: OWASP Web Security Testing Guide v4
# =============================================================================

[SPL-WSTG01-001]
name = WSTG-INFO-01: Conduct Search Engine Discovery Reconnaissance
description = Detects search engine reconnaissance activity identified via user-agent strings and access patterns from known SEO crawlers probing sensitive paths
severity = low
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (useragent="*Googlebot*" OR useragent="*bingbot*" OR useragent="*Baiduspider*" OR useragent="*YandexBot*") (uri="/.env" OR uri="/.git" OR uri="/wp-admin" OR uri="/admin" OR uri="/backup" OR uri="/config" OR uri="/.htaccess" OR uri="/robots.txt" OR uri="/sitemap.xml" OR uri="/server-status" OR uri="/.DS_Store") | stats count, dc(uri) as unique_uris, values(uri) as accessed_uris by src_ip, useragent | where unique_uris > 5
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-01"]
mitre = ["T1595", "T1592"]
compliance = ["PCI-DSS-11.3", "NIST-RA-5"]
risk_score = 25

[SPL-WSTG01-002]
name = WSTG-INFO-02: Fingerprint Web Server via HTTP Headers
description = Detects web server fingerprinting attempts through verbose server headers disclosing technology stack details
severity = informational
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) | eval server_header=if(match(status, "^[2-5]"), "present", "absent") | where server_header="present" | regex _raw="(?i)server:\s+(Apache|nginx|IIS|Microsoft-IIS|Tomcat|Jetty|lighttpd|Openresty|Caddy)[/0-9._\s-]*" | stats count, values(server_header) as server_versions by src_ip, dest_ip | where count > 50
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-02"]
mitre = ["T1592.001"]
compliance = ["PCI-DSS-6.5", "NIST-CM-7"]
risk_score = 15

[SPL-WSTG01-003]
name = WSTG-INFO-03: Review Webserver Metafiles for Information Leakage
description = Detects access to metafiles like robots.txt, sitemap.xml, .DS_Store, .git, .svn that may leak directory structure and sensitive paths
severity = low
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/robots.txt" OR uri="/sitemap.xml" OR uri="/.DS_Store" OR uri="/.git/HEAD" OR uri="/.svn/entries" OR uri="/crossdomain.xml" OR uri="/clientaccesspolicy.xml" OR uri="/.env" OR uri="/.htaccess" OR uri="/WEB-INF/web.xml" OR uri="/META-INF/") status>=200 status<400 | stats count, values(uri) as accessed_files by src_ip | sort -count | head 50
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-03"]
mitre = ["T1592.001", "T1595.001"]
compliance = ["PCI-DSS-6.5", "NIST-CM-7"]
risk_score = 20

[SPL-WSTG01-004]
name = WSTG-INFO-04: Enumerate Applications on Webserver
description = Detects application enumeration through sequential access to common application paths and virtual host probing
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/phpmyadmin" OR uri="/phpinfo.php" OR uri="/test" OR uri="/dev" OR uri="/staging" OR uri="/admin" OR uri="/manager" OR uri="/console" OR uri="/actuator" OR uri="/swagger-ui.html" OR uri="/api-docs" OR uri="/graphql" OR uri="/.well-known/security.txt") | stats dc(uri) as unique_paths, count, values(uri) as paths by src_ip | where unique_paths > 10
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-04"]
mitre = ["T1595.001", "T1087"]
compliance = ["PCI-DSS-11.3", "NIST-RA-5"]
risk_score = 35

[SPL-WSTG01-005]
name = WSTG-INFO-05: Review Webpage Content for Information Leakage
description = Detects information leakage through error messages, debug output, source code comments, and stack traces in HTTP responses
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:error OR sourcetype=nginx:error) (status=500 OR status=403 OR status=400) | regex _raw="(?i)(stack trace|debug mode|error report|exception|traceback|fatal error|syntax error|internal server error|path disclosure|root:/|c:\\|/var/www|/home/)" | stats count, values(uri) as error_pages by src_ip | where count > 5
sourcetype = access_logs,apache:error,nginx:error
action = log
references = ["WSTG-INFO-05"]
mitre = ["T1592.002"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-007", "NIST-CM-7"]
risk_score = 40

[SPL-WSTG01-006]
name = WSTG-INFO-06: Identify Application Entry Points via Parameter Analysis
description = Detects application entry point enumeration through systematic probing of URL parameters and API endpoints
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) | regex uri="[\?&](id|user|page|action|cmd|exec|file|path|doc|folder|content|template|q|search|query|keyword)=[^&]*" | eval param_key=replace(uri, ".*[\?&](\w+)=.*", "\1") | stats dc(param_key) as unique_params, dc(uri) as unique_uris, count by src_ip | where unique_params > 15 OR unique_uris > 100
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-06"]
mitre = ["T1595.001", "T1590"]
compliance = ["PCI-DSS-6.5", "NIST-RA-5"]
risk_score = 30

[SPL-WSTG01-007]
name = WSTG-INFO-07: Map Execution Paths Through Application Navigation
description = Detects path traversal and forced browsing attempts that map application structure through sequential URL probing
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (status=404 OR status=403) | regex uri="\.(bak|old|orig|swp|save|temp|tmp|copy|orig|inc|conf|cfg|config|log|sql|db)" | stats count, dc(uri) as unique_404s, values(uri) as attempted_paths by src_ip | where unique_404s > 20
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-07"]
mitre = ["T1595.001"]
compliance = ["PCI-DSS-6.5"]
risk_score = 35

[SPL-WSTG01-008]
name = WSTG-INFO-08: Fingerprint Web Application Framework via File Signatures
description = Detects framework fingerprinting through access to framework-specific files and paths indicating technology identification
severity = low
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/wp-login.php" OR uri="/wp-content" OR uri="/administrator" OR uri="/joomla" OR uri="/Drupal" OR uri="/sites/default" OR uri="/app_dev.php" OR uri="/symfony" OR uri="/laravel" OR uri="/django" OR uri="/admin/login" OR uri="/rails" OR uri="/Gemfile" OR uri="/package.json" OR uri="/composer.json" OR uri="/yarn.lock" OR uri="/Gopkg.toml") | stats count, dc(uri) as unique_frameworks by src_ip | where unique_frameworks > 5
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-08"]
mitre = ["T1592.002"]
compliance = ["NIST-CM-7"]
risk_score = 15

[SPL-WSTG01-009]
name = WSTG-INFO-09: Identify Application Entry Points via Form Analysis
description = Detects systematic form and input field enumeration through repeated access to pages with forms and parameter probing
severity = low
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) method=POST | regex uri="(login|register|signup|contact|search|comment|feedback|order|checkout|profile|password-reset|subscribe|upload)" | stats count, dc(uri) as unique_forms by src_ip | where count > 50
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-INFO-09"]
mitre = ["T1595.001"]
compliance = ["PCI-DSS-6.5"]
risk_score = 20

[SPL-WSTG01-010]
name = WSTG-INFO-10: Detect Outdated Software via Server Headers
description = Detects outdated software versions disclosed in HTTP response headers creating known vulnerability exposure
severity = high
search = index=web sourcetype=access_logs | regex _raw="(?i)server:\s+(Apache/[0-2]\.[0-4]|nginx/[0-1]\.[0-9]|Microsoft-IIS/[0-7]|PHP/[0-4]|OpenSSL/[0-1]\.[0-1]|Tomcat/[0-8])" | stats count, values(server) as detected_versions by dest_ip | sort -count
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-INFO-02", "WSTG-CONF-07"]
mitre = ["T1592.001"]
compliance = ["PCI-DSS-6.5", "PCI-DSS-11.3", "NIST-SI-2"]
risk_score = 60

[SPL-CONF-001]
name = WSTG-CONF-01: Test Network Infrastructure Configuration for Exposed Services
description = Detects access to exposed infrastructure management interfaces and admin consoles from external networks
severity = critical
search = index=network OR index=web (sourcetype=access_logs OR sourcetype=pan:traffic OR sourcetype=cisco:asa) (dest_port=22 OR dest_port=23 OR dest_port=3389 OR dest_port=5900 OR dest_port=5901 OR dest_port=8080 OR dest_port=8443 OR dest_port=9090 OR dest_port=2082 OR dest_port=2083 OR dest_port=2086 OR dest_port=2087 OR dest_port=2222 OR dest_port=10000 OR dest_port=3306 OR dest_port=5432 OR dest_port=27017 OR dest_port=6379) src_ip!="10.0.0.0/8" src_ip!="172.16.0.0/12" src_ip!="192.168.0.0/16" | stats count, dc(dest_port) as unique_ports by src_ip, dest_ip | where unique_ports > 3
sourcetype = access_logs,pan:traffic,cisco:asa
action = email
references = ["WSTG-CONF-01"]
mitre = ["T1595.001", "T1046"]
compliance = ["PCI-DSS-1.3", "NIST-SC-7"]
risk_score = 85

[SPL-CONF-002]
name = WSTG-CONF-02: Test Application Platform Configuration for Debug Mode
description = Detects application debug mode indicators in responses including stack traces, debug parameters, and verbose errors
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:error OR sourcetype=nginx:error) | regex _raw="(?i)(debug\s*=\s*true|debug\s*=\s*1|DEBUG_MODE|APP_DEBUG|RAILS_ENV.*development|django.*debug.*true|express.*debug|stack.?trace|traceback|exception.*at\s|java\.lang\.\w+Exception|System\.InvalidOperationException)" | stats count, values(uri) as debug_pages by src_ip, dest_ip | where count > 3
sourcetype = access_logs,apache:error,nginx:error
action = email
references = ["WSTG-CONF-02"]
mitre = ["T1592.002"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-007"]
risk_score = 65

[SPL-CONF-003]
name = WSTG-CONF-03: File Extension Handling for Sensitive File Exposure
description = Detects access attempts to files with sensitive extensions that should not be served by the web server
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="*.bak" OR uri="*.old" OR uri="*.orig" OR uri="*.swp" OR uri="*.save" OR uri="*.env" OR uri="*.conf" OR uri="*.cfg" OR uri="*.ini" OR uri="*.sql" OR uri="*.log" OR uri="*.db" OR uri="*.sqlite" OR uri="*.mdb" OR uri="*.git" OR uri="*.svn" OR uri="*.htaccess" OR uri="*.htpasswd" OR uri="*.ssh" OR uri="*.pem" OR uri="*.key" OR uri="*.cert" OR uri="*.p12" OR uri="*.jks") status>=200 status<400 | stats count, values(uri) as sensitive_files by src_ip | sort -count
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-CONF-03"]
mitre = ["T1592.001", "T1083"]
compliance = ["PCI-DSS-6.5", "NIST-CM-7"]
risk_score = 70

[SPL-CONF-004]
name = WSTG-CONF-04: Review Old Backup and Unreferenced Files for Sensitive Data
description = Detects access to backup files, unreferenced files, and archive files that may contain sensitive data
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="*.zip" OR uri="*.tar" OR uri="*.tar.gz" OR uri="*.tgz" OR uri="*.rar" OR uri="*.7z" OR uri="*.bak" OR uri="*.backup" OR uri="*.old" OR uri="*~" OR uri="*.copy" OR uri="*_backup*" OR uri="*backup.sql" OR uri="*dump.sql" OR uri="*.sql.bz2" OR uri="*.sql.gz" OR uri="/backup/" OR uri="/backups/" OR uri="/db/" OR uri="/database/") status>=200 status<400 | stats count, values(uri) as backup_files by src_ip | sort -count
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-CONF-04"]
mitre = ["T1592.001", "T1083"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-009"]
risk_score = 75

[SPL-CONF-005]
name = WSTG-CONF-05: Enumerate Infrastructure and Admin Interfaces
description = Detects enumeration of administrative interfaces, management consoles, and debug endpoints
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/admin" OR uri="/administrator" OR uri="/manager" OR uri="/console" OR uri="/phpmyadmin" OR uri="/adminer" OR uri="/cpanel" OR uri="/webadmin" OR uri="/moderator" OR uri="/actuator" OR uri="/actuator/env" OR uri="/actuator/health" OR uri="/actuator/info" OR uri="/actuator/mappings" OR uri="/actuator/configprops" OR uri="/actuator/beans" OR uri="/actuator/heapdump" OR uri="/actuator/threaddump" OR uri="/debug" OR uri="/trace" OR uri="/v1/api-docs" OR uri="/swagger" OR uri="/graphql" OR uri="/graphiql" OR uri="/.well-known/security.txt") | stats count, dc(uri) as unique_admin_paths by src_ip | where unique_admin_paths > 3
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-CONF-05"]
mitre = ["T1595.001", "T1592.002"]
compliance = ["PCI-DSS-6.5", "NIST-AC-17"]
risk_score = 65

[SPL-CONF-006]
name = WSTG-CONF-06: HTTP Methods and XST Detection
description = Detects use of uncommon or dangerous HTTP methods (PUT, DELETE, TRACE, OPTIONS, PATCH) that may indicate cross-site tracing or unauthorized operations
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (method=PUT OR method=DELETE OR method=TRACE OR method=OPTIONS OR method=PATCH OR method=CONNECT OR method=PROPFIND OR method=PROPPATCH OR method=MKCOL OR method=COPY OR method=MOVE OR method=LOCK OR method=UNLOCK) | stats count, values(method) as methods_used, dc(uri) as unique_uris by src_ip, dest_ip | where count > 10
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-CONF-06"]
mitre = ["T1595.001", "T1220"]
compliance = ["PCI-DSS-6.5"]
risk_score = 40

[SPL-CONF-007]
name = WSTG-CONF-07: Test HTTP Strict Transport Security for Missing or Weak HSTS
description = Detects web responses missing HSTS header or with weak HSTS configuration indicating SSL stripping vulnerability
severity = high
search = index=web sourcetype=access_logs | regex _raw="(?i)strict-transport-security\s*:" | eval has_hsts=if(match(_raw, "(?i)strict-transport-security"), "yes", "no") | stats count, values(has_hsts) as hsts_status by dest_ip | where hsts_status="no" OR count=0 | append [search index=web sourcetype=access_logs status=200 | regex _raw="(?i)strict-transport-security:\s*max-age\s*=\s*[0-9]{1,5}[^0-9]" | eval weak_hsts="yes" | stats count by dest_ip] | dedup dest_ip
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-CONF-07", "WSTG-ATHN-01"]
mitre = ["T1595.001"]
compliance = ["PCI-DSS-4.1", "NIST-SC-8"]
risk_score = 55

[SPL-CONF-008]
name = WSTG-CONF-08: RIA Cross Domain Policy for Overly Permissive Access
description = Detects overly permissive cross-domain policy files that allow unauthorized cross-origin requests
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/crossdomain.xml" OR uri="/clientaccesspolicy.xml") status>=200 status<400 | regex _raw="(?i)(allow-access-from\s+domain\s*=\s*\"\\*\"|permitted-cross-domain-policies\s*=\s*\"all\"|site-control\s*=\s*\"all\")" | stats count, values(uri) as policy_files by src_ip, dest_ip
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-CONF-08"]
mitre = ["T1189"]
compliance = ["PCI-DSS-6.5"]
risk_score = 40

[SPL-CONF-009]
name = WSTG-CONF-09: File Permission Testing for Improper Access Controls
description = Detects unauthorized file access attempts through path traversal and permission bypass patterns
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="*../*" OR uri="*..\\*" OR uri="*/etc/passwd*" OR uri="*/etc/shadow*" OR uri="*/proc/self*" OR uri="*\\windows\\system32*" OR uri="*%2e%2e*" OR uri="*%252e*" OR uri="*%c0%ae*" OR uri="*....//*" OR uri="*..%2f*" OR uri="*..%5c*") | stats count, values(uri) as traversal_attempts by src_ip | where count > 3
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-CONF-09", "WSTG-ATHZ-01"]
mitre = ["T1080", "T1190"]
compliance = ["PCI-DSS-6.5", "NIST-AC-3"]
risk_score = 80

[SPL-CONF-010]
name = WSTG-CONF-10: Content Security Policy Header Missing or Weak
description = Detects responses missing Content-Security-Policy header or with weak CSP directives allowing script injection
severity = medium
search = index=web sourcetype=access_logs status=200 | regex _raw="(?i)content-security-policy\s*:" | eval has_csp=if(match(_raw, "(?i)content-security-policy"), "present", "missing") | stats count as total_responses, count(eval(has_csp="present")) as csp_present, count(eval(has_csp="missing")) as csp_missing by dest_ip | eval csp_coverage=round(csp_present/total_responses*100, 1) | where csp_coverage < 50
sourcetype = access_logs,apache:access
action = log
references = ["WSTG-CONF-10"]
mitre = ["T1059.007"]
compliance = ["PCI-DSS-6.5", "NIST-SI-10"]
risk_score = 45

[SPL-CONF-011]
name = WSTG-CONF-11: CORS Configuration Testing for Overly Permissive Origins
description = Detects overly permissive CORS configurations that allow any origin or reflect arbitrary origins
severity = high
search = index=web sourcetype=access_logs | regex _raw="(?i)access-control-allow-origin\s*:\s*\\*" | eval cors_wildcard=1 | append [search index=web sourcetype=access_logs | regex _raw="(?i)access-control-allow-origin\s*:\s*http[^,\r\n]*" | eval cors_origin=1] | stats count, values(cors_origin) by dest_ip, src_ip | where count > 5
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-CONF-11"]
mitre = ["T1189"]
compliance = ["PCI-DSS-6.5"]
risk_score = 65

[SPL-CONF-012]
name = WSTG-CONF-12: HTTP Response Header Security Testing
description = Detects missing or misconfigured security headers including X-Content-Type-Options, X-Frame-Options, Referrer-Policy, Permissions-Policy
severity = medium
search = index=web sourcetype=access_logs status=200 | eval missing_xcto=if(match(_raw, "(?i)x-content-type-options"), 0, 1), missing_xfo=if(match(_raw, "(?i)x-frame-options"), 0, 1), missing_rp=if(match(_raw, "(?i)referrer-policy"), 0, 1), missing_pp=if(match(_raw, "(?i)permissions-policy"), 0, 1) | stats sum(missing_xcto) as missing_x_content_type, sum(missing_xfo) as missing_x_frame_options, sum(missing_rp) as missing_referrer_policy, sum(missing_pp) as missing_permissions_policy, count as total by dest_ip | eval risk_pct=round((missing_x_content_type+missing_x_frame_options+missing_referrer_policy+missing_permissions_policy)/(total*4)*100, 1) | where risk_pct > 75
sourcetype = access_logs
action = log
references = ["WSTG-CONF-12"]
mitre = ["T1595.001"]
compliance = ["PCI-DSS-6.5", "NIST-CM-7"]
risk_score = 40

[SPL-CONF-013]
name = WSTG-CONF-13: Clickjacking via Missing X-Frame-Options
description = Detects pages missing X-Frame-Options header or with ALLOW-FROM directive enabling clickjacking attacks
severity = medium
search = index=web sourcetype=access_logs status=200 (uri="/login" OR uri="/account" OR uri="/transfer" OR uri="/admin" OR uri="/settings" OR uri="/change-password" OR uri="/delete" OR uri="/authorize" OR uri="/payment" OR uri="/checkout") | eval has_xfo=if(match(_raw, "(?i)x-frame-options"), 1, 0) | where has_xfo=0 | stats count by dest_ip, uri | sort -count
sourcetype = access_logs
action = log
references = ["WSTG-CONF-13"]
mitre = ["T1189"]
compliance = ["PCI-DSS-6.5"]
risk_score = 40

[SPL-CONF-014]
name = WSTG-CONF-14: Error Handling for Information Disclosure in Stack Traces
description = Detects detailed error messages and stack traces exposed in web responses that disclose application internals
severity = high
search = index=web (sourcetype=apache:error OR sourcetype=nginx:error OR sourcetype=access_logs) | regex _raw="(?i)(exception.*at\s|stack\s*trace|traceback|java\.lang\.\w+|System\.NullReferenceException|System\.InvalidOperationException|PHP\s*Fatal|PHP\s*Warning|TypeError|ReferenceError|SyntaxError|Internal Server Error|\/var\/www|\/home\/|c:\\|\/usr\/local|\/opt\/)" | stats count, dc(uri) as unique_errors, values(uri) as error_pages by src_ip, dest_ip | where count > 5
sourcetype = apache:error,nginx:error,access_logs
action = email
references = ["WSTG-CONF-14"]
mitre = ["T1592.002"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-007"]
risk_score = 60

[SPL-CONF-015]
name = WSTG-CONF-15: Database Server Exposure Detection
description = Detects exposed database server ports and management interfaces accessible from external networks
severity = critical
search = index=network OR index=firewall (sourcetype=pan:traffic OR sourcetype=cisco:asa OR sourcetype=fortinet:traffic) (dest_port=3306 OR dest_port=5432 OR dest_port=1433 OR dest_port=1521 OR dest_port=27017 OR dest_port=27018 OR dest_port=6379 OR dest_port=11211 OR dest_port=9042 OR dest_port=7474 OR dest_port=8529 OR dest_port=8086 OR dest_port=19530 OR dest_port=6333) src_ip!="10.0.0.0/8" src_ip!="172.16.0.0/12" src_ip!="192.168.0.0/16" | stats count, values(dest_port) as exposed_ports by src_ip, dest_ip | sort -count
sourcetype = pan:traffic,cisco:asa,fortinet:traffic
action = email
references = ["WSTG-CONF-15"]
mitre = ["T1595.001", "T1046"]
compliance = ["PCI-DSS-1.3", "NIST-SC-7"]
risk_score = 90

[SPL-CONF-016]
name = WSTG-CONF-16: SSL/TLS Configuration Testing for Weak Protocols
description = Detects servers accepting weak SSL/TLS protocols (SSLv3, TLS 1.0, TLS 1.1) that are vulnerable to downgrade attacks
severity = critical
search = index=network OR index=web (sourcetype=pan:traffic OR sourcetype=access_logs OR sourcetype=ssl:logs) (ssl_version="SSLv3" OR ssl_version="TLSv1" OR ssl_version="TLSv1.0" OR ssl_version="TLSv1.1" OR ssl_version="TLS 1.0" OR ssl_version="TLS 1.1") | stats count, values(ssl_version) as weak_protocols, dc(dest_port) as ports by src_ip, dest_ip | where count > 0
sourcetype = pan:traffic,ssl:logs,access_logs
action = email
references = ["WSTG-CONF-16", "WSTG-ATHN-01"]
mitre = ["T1595.001", "T1573"]
compliance = ["PCI-DSS-4.1", "NIST-SC-8", "GDPR-32A-003"]
risk_score = 90

[SPL-CONF-017]
name = WSTG-CONF-17: Weak Cipher Suite Detection in TLS Negotiation
description = Detects servers negotiating weak cipher suites vulnerable to BEAST, POODLE, or SWEET32 attacks
severity = high
search = index=network sourcetype=ssl:logs | regex cipher="(?i)(RC4|DES|3DES|MD5|NULL|EXPORT|anon|eNULL|aNULL|CAMELLIA)" | eval weak_cipher=1 | stats count, values(cipher) as weak_ciphers by dest_ip, src_ip | where weak_cipher=1 | sort -count
sourcetype = ssl:logs
action = email
references = ["WSTG-CONF-17"]
mitre = ["T1573"]
compliance = ["PCI-DSS-4.1", "NIST-SC-8"]
risk_score = 70

[SPL-CONF-018]
name = WSTG-CONF-18: Database Error Message Information Leakage
description = Detects database error messages in HTTP responses that reveal database type, version, schema, or connection details
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:error OR sourcetype=nginx:error) | regex _raw="(?i)(ODBC.*error|SQL\s*Server.*error|mysql.*error|postgresql.*error|ORA-\d{5}|sqlite.*error|mongod.*error|redis.*error|Cassandra.*error|syntax error.*sql|unclosed quotation mark|invalid SQL|mysql_fetch|pg_query|sqlcmd|ORA-\d{5}|SQLSTATE|Microsoft OLE DB|SQL command not properly ended)" | stats count, values(uri) as error_pages by src_ip, dest_ip | where count > 3
sourcetype = access_logs,apache:error,nginx:error
action = email
references = ["WSTG-CONF-18"]
mitre = ["T1592.002"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-007"]
risk_score = 65

[SPL-CONF-019]
name = WSTG-CONF-19: PostgreSQL pg_authid Exposure Detection
description = Detects queries or error messages exposing PostgreSQL authentication catalog pg_authid indicating credential data at rest exposure
severity = critical
search = index=database sourcetype=postgresql_log | regex _raw="(?i)(SELECT.*FROM\s+pg_authid|pg_authid|pg_shadow|pg_roles|rolpassword|md5\w{32}|SCRAM-SHA-256\$|SELECT.*FROM\s+pg_catalog\.pg_authid)" | stats count, values(query) as exposed_queries by src_ip, dest_ip, user | where count > 0
sourcetype = postgresql_log
action = email
references = ["WSTG-CONF-19", "WSTG-ATHN-25"]
mitre = ["T1552", "T1082"]
compliance = ["PCI-DSS-3.4", "GDPR-32A-001", "NIST-IA-5"]
risk_score = 95

[SPL-CONF-020]
name = WSTG-CONF-20: MongoDB admin Database Access Detection
description = Detects access to MongoDB admin database or system collections that store credentials and configuration
severity = critical
search = index=database sourcetype=mongodb_log | regex _raw="(?i)(admin\.\$cmd|admin\.system\.users|admin\.system\.version|admin\.system\.roles|db\.system\.users|db\.getSiblingDB\('admin'\)|\.system\.users|createUser|updateUser|grantRole|db\.auth\(|mechanism.*SCRAM)" | stats count, values(query) as admin_queries by src_ip, user, dest_ip | where count > 0
sourcetype = mongodb_log
action = email
references = ["WSTG-CONF-20", "WSTG-ATHN-29"]
mitre = ["T1552", "T1082"]
compliance = ["PCI-DSS-3.4", "GDPR-32A-001", "NIST-IA-5"]
risk_score = 95

[SPL-CONF-021]
name = WSTG-CONF-21: Redis CONFIG GET Exposure Detection
description = Detects Redis CONFIG GET commands that may expose passwords, ACL rules, and sensitive configuration
severity = critical
search = index=database sourcetype=redis_log (query="CONFIG GET *" OR query="CONFIG GET requirepass" OR query="CONFIG GET masterauth" OR query="CONFIG GET aclfile" OR query="ACL LIST" OR query="ACL WHOAMI" OR query="CONFIG GET bind" OR query="CONFIG GET protected-mode") | stats count, values(query) as config_queries by src_ip, dest_ip | where count > 0
sourcetype = redis_log
action = email
references = ["WSTG-CONF-21", "WSTG-ATHN-32"]
mitre = ["T1552", "T1082"]
compliance = ["PCI-DSS-3.4", "GDPR-32A-001"]
risk_score = 95

[SPL-CONF-022]
name = WSTG-CONF-22: Neo4j auth Store Credential Exposure Detection
description = Detects Neo4j authentication store access and credential exposure through auth API calls and system queries
severity = critical
search = index=database sourcetype=neo4j_log | regex _raw="(?i)(SHOW USERS|SHOW ROLE|SHOW PRIVILEGES|ALTER USER|CREATE USER|db\.security\.|system\.users|auth.*store|CALL db\.security|CALL dbms\.security)" | stats count, values(query) as auth_queries by src_ip, user | where count > 0
sourcetype = neo4j_log
action = email
references = ["WSTG-CONF-22", "WSTG-ATHN-33"]
mitre = ["T1552", "T1082"]
compliance = ["PCI-DSS-3.4", "GDPR-32A-001"]
risk_score = 90

[SPL-CONF-023]
name = WSTG-CONF-23: Exposed Environment Variables and Configuration Files
description = Detects access to exposed environment files (.env), configuration files, and container metadata that may contain secrets
severity = critical
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/.env" OR uri="/.env.local" OR uri="/.env.production" OR uri="/.env.staging" OR uri="/config.yml" OR uri="/config.json" OR uri="/config.php" OR uri="/config.py" OR uri="/config.rb" OR uri="/settings.py" OR uri="/application.yml" OR uri="/application.properties" OR uri="/database.yml" OR uri="/.aws/credentials" OR uri="/.azure/credentials" OR uri="/.gcp/credentials" OR uri="/docker-compose.yml" OR uri="/Dockerfile" OR uri="/Kubernetes" OR uri="/.kubectl" OR uri="/wp-config.php") status>=200 status<400 | stats count, values(uri) as config_files_accessed by src_ip, dest_ip | sort -count
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-CONF-23"]
mitre = ["T1592.001", "T1552"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-001", "NIST-CM-7"]
risk_score = 90

[SPL-CONF-024]
name = WSTG-CONF-24: Cloud Metadata Service Exposure Detection
description = Detects access to cloud metadata services (AWS IMDS, GCP metadata, Azure metadata) that could expose instance credentials
severity = critical
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="*169.254.169.254*" OR uri="*metadata.google.internal*" OR uri="*metadata.azure.com*" OR uri="/latest/meta-data/" OR uri="/computeMetadata/v1/" OR uri="/metadata/instance" OR uri="/openid-configuration" OR uri="/.well-known/openid-configuration") | stats count, values(uri) as metadata_queries by src_ip | where count > 0
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-CONF-24", "WSTG-ATHN-57"]
mitre = ["T1552.005", "T1078"]
compliance = ["PCI-DSS-6.5", "NIST-IA-5"]
risk_score = 95

[SPL-CONF-025]
name = WSTG-CONF-25: Default Credential Usage Detection
description = Detects login attempts using known default credentials for databases, web apps, and infrastructure
severity = critical
search = index=web OR index=database (sourcetype=access_logs OR sourcetype=postgresql_log OR sourcetype=mongodb_log OR sourcetype=mysql_log) (user="admin" OR user="root" OR user="postgres" OR user="sa" OR user="administrator" OR user="test" OR user="guest" OR user="demo" OR user="default" OR user="ubuntu" OR user="oracle" OR user="sys" OR user="system") (action="login" OR action="authenticate" OR status="failure" OR status=401) | stats count, values(user) as attempted_users by src_ip, dest_ip | where count > 5
sourcetype = access_logs,postgresql_log,mongodb_log,mysql_log
action = email
references = ["WSTG-CONF-25", "WSTG-ATHN-02"]
mitre = ["T1078.001", "T1110"]
compliance = ["PCI-DSS-8.5", "HIPAA-ADMIN-005", "NIST-IA-5"]
risk_score = 90

[SPL-IDM-001]
name = WSTG-IDM-01: User Enumeration via Registration Error Messages
description = Detects user enumeration through inconsistent registration and login error messages revealing whether accounts exist
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access OR sourcetype=nginx:access) (uri="/register" OR uri="/signup" OR uri="/create-account" OR uri="/login" OR uri="/auth/login" OR uri="/api/auth") (status=400 OR status=401 OR status=403 OR status=409) | regex _raw="(?i)(user.*already.*exist|email.*already.*registered|username.*taken|account.*found|user.*not.*found|invalid.*username|invalid.*email|no.*account)" | stats count by src_ip, dest_ip | where count > 10
sourcetype = access_logs,apache:access,nginx:access
action = log
references = ["WSTG-IDM-01"]
mitre = ["T1110.001", "T1592.004"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-005"]
risk_score = 40

[SPL-IDM-002]
name = WSTG-IDM-02: User Enumeration via Login Response Timing
description = Detects timing-based user enumeration through significant differences in response times between valid and invalid usernames
severity = medium
search = index=web (sourcetype=access_logs OR sourcetype=apache:access) (uri="/login" OR uri="/auth/login" OR uri="/api/auth") method=POST | eval response_time=response_time | bin response_time span=100ms | stats avg(response_time) as avg_time, stdev(response_time) as std_time, count by src_ip, status | where std_time > 500 AND status=401
sourcetype = access_logs,apache:access
action = log
references = ["WSTG-IDM-02"]
mitre = ["T1110.001"]
compliance = ["PCI-DSS-6.5"]
risk_score = 35

[SPL-IDM-003]
name = WSTG-IDM-03: Account Lockout Bypass Detection
description = Detects account lockout bypass attempts through credential stuffing with rotating IPs or lockout threshold probing
severity = high
search = index=web sourcetype=access_logs (uri="/login" OR uri="/auth/login" OR uri="/api/auth") method=POST status=401 | bin _time span=5m | stats count as failed_attempts, dc(src_ip) as unique_ips by user, _time | where failed_attempts > 20 OR (failed_attempts > 5 AND unique_ips > 3)
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-IDM-03"]
mitre = ["T1110.003", "T1110.004"]
compliance = ["PCI-DSS-8.5", "NIST-AC-7"]
risk_score = 70

[SPL-IDM-004]
name = WSTG-IDM-04: Weak Password Policy Detection
description = Detects weak password policy by monitoring password change attempts that accept commonly weak passwords
severity = medium
search = index=web sourcetype=access_logs (uri="/change-password" OR uri="/password-reset" OR uri="/api/users/password") method=POST status=200 | regex _raw="(?i)(password.*too.*short|password.*must.*contain|password.*complexity|password.*requirements)" | eval weak_policy=1 | append [search index=web sourcetype=access_logs (uri="/change-password" OR uri="/password-reset") method=POST status=200 | eval weak_policy=0] | stats count, sum(weak_policy) as weak_count by dest_ip
sourcetype = access_logs
action = log
references = ["WSTG-IDM-04"]
mitre = ["T1110"]
compliance = ["PCI-DSS-8.5", "HIPAA-WS-005", "NIST-IA-5"]
risk_score = 40

[SPL-IDM-005]
name = WSTG-IDM-05: Insecure Remember Me and Password Storage
description = Detects insecure password storage indicators including base64-encoded cookies, auto-complete on password fields, and persistent sessions
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:access) | regex _raw="(?i)(remember[_-]?me.*=.*[A-Za-z0-9+/=]{20,}|autologin.*=|persistent.*session|password.*cookie|auth.*cookie.*base64)" | stats count, values(uri) as affected_pages by src_ip, dest_ip | where count > 5
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-IDM-05", "WSTG-ATHN-05"]
mitre = ["T1552"]
compliance = ["PCI-DSS-8.5", "NIST-IA-5"]
risk_score = 55

[SPL-IDM-006]
name = WSTG-IDM-06: Role and Permission Enumeration via API Responses
description = Detects role and permission enumeration through API responses that expose role names, permission lists, or access control metadata
severity = high
search = index=web sourcetype=access_logs | regex uri="(/api/v[0-9]+/(roles|permissions|users|groups|policies|access-control|rbac|entitlements|privileges))" | regex _raw="(?i)(admin|superuser|root|manager|editor|viewer|role.*=|permission.*=|access.*level)" | stats count, dc(uri) as unique_endpoints, values(uri) as endpoints by src_ip | where unique_endpoints > 5
sourcetype = access_logs,nginx:access
action = email
references = ["WSTG-IDM-06"]
mitre = ["T1087", "T1592.004"]
compliance = ["PCI-DSS-8.5", "NIST-AC-2"]
risk_score = 55

[SPL-IDM-007]
name = WSTG-IDM-07: Credential Stuffing Attack Detection
description = Detects credential stuffing attacks through high-volume login attempts with different credentials from distributed sources
severity = critical
search = index=web sourcetype=access_logs (uri="/login" OR uri="/auth/login" OR uri="/api/auth" OR uri="/oauth/token") method=POST status=401 | bin _time span=1h | stats count as failed_logins, dc(src_ip) as unique_ips, dc(user) as unique_users by dest_ip, _time | where failed_logins > 100 AND unique_ips > 10 AND unique_users > 50
sourcetype = access_logs,apache:access,nginx:access
action = email
references = ["WSTG-IDM-07", "WSTG-ATHN-12"]
mitre = ["T1110.004"]
compliance = ["PCI-DSS-8.5", "NIST-AC-7"]
risk_score = 90

[SPL-IDM-008]
name = WSTG-IDM-08: PII Exposure in API Responses via GraphQL Introspection
description = Detects PII and role data exposure through GraphQL introspection queries that reveal schema and field-level details
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=apache:access) | regex _raw="(?i)(__schema|__type|__directive|__enumValue|__field|__inputValue|__type.*name.*fields|introspection)" | regex uri="(/graphql|/api/graphql|/graphiql)" | stats count, dc(uri) as unique_endpoints by src_ip | where count > 3
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-IDM-08"]
mitre = ["T1592.002"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-014"]
risk_score = 60

[SPL-IDM-009]
name = WSTG-IDM-09: Authentication Bypass via Forceful Browsing
description = Detects authentication bypass through direct access to authenticated endpoints without valid session tokens
severity = critical
search = index=web sourcetype=access_logs (uri="/admin/*" OR uri="/dashboard/*" OR uri="/management/*" OR uri="/settings/*" OR uri="/profile/*" OR uri="/account/*" OR uri="/api/v*/users/*" OR uri="/api/v*/orders/*") status=200 | regex _raw="(?i)^(?!.*session|.*token|.*cookie|.*authorization)" | stats count by src_ip, dest_ip, uri | where count > 20
sourcetype = access_logs
action = email
references = ["WSTG-IDM-09", "WSTG-ATHN-04"]
mitre = ["T1078", "T1190"]
compliance = ["PCI-DSS-8.5", "NIST-AC-3"]
risk_score = 85

[SPL-IDM-010]
name = WSTG-IDM-10: Multi-Factor Authentication Bypass Detection
description = Detects attempts to bypass multi-factor authentication through OTP reuse, session manipulation, or direct API access
severity = critical
search = index=web sourcetype=access_logs (uri="/mfa/verify" OR uri="/2fa/verify" OR uri="/otp/verify" OR uri="/auth/mfa" OR uri="/api/mfa") | regex _raw="(?i)(otp.*reuse|mfa.*bypass|2fa.*skip|token.*expired|challenge.*bypass)" | stats count, values(uri) as mfa_endpoints, values(status) as statuses by src_ip, dest_ip | where count > 5
sourcetype = access_logs
action = email
references = ["WSTG-IDM-10", "WSTG-ATHN-11"]
mitre = ["T1110", "T1078"]
compliance = ["PCI-DSS-8.3", "NIST-IA-2"]
risk_score = 90

[SPL-IDM-011]
name = WSTG-IDM-11: Orphaned or Dormant Account Detection
description = Detects dormant accounts that have not been used for an extended period, indicating potential orphaned accounts
severity = medium
search = index=web sourcetype=access_logs (action="login" OR action="authentication") | stats last(_time) as last_login, count by user | eval days_since_login=round((now()-last_login)/86400, 1) | where days_since_login > 90 AND count > 0 | sort -days_since_login
sourcetype = access_logs,wineventlog:security
action = log
references = ["WSTG-IDM-11"]
mitre = ["T1078.002"]
compliance = ["PCI-DSS-8.5", "HIPAA-WS-003", "NIST-AC-2"]
risk_score = 35

[SPL-IDM-012]
name = WSTG-IDM-12: Privileged Account Abuse Detection
description = Detects suspicious privileged account activity including unusual access patterns, off-hours usage, and bulk operations
severity = high
search = index=web (sourcetype=access_logs OR sourcetype=wineventlog:security) (user="*admin*" OR user="root" OR user="*superuser*" OR user="*manager*" OR role="admin" OR role="superuser") | eval hour_of_day=strftime(_time, "%H") | eval off_hours=if(hour_of_day < 6 OR hour_of_day > 22, "yes", "no") | stats count, dc(uri) as unique_actions, values(uri) as actions by user, off_hours | where off_hours="yes" OR unique_actions > 50
sourcetype = access_logs,wineventlog:security
action = email
references = ["WSTG-IDM-12"]
mitre = ["T1078.002", "T1078.004"]
compliance = ["PCI-DSS-8.5", "NIST-AC-6"]
risk_score = 65

[SPL-IDM-013]
name = WSTG-IDM-13: Account Creation Anomaly Detection
description = Detects anomalous account creation patterns indicating potential abuse or automated account creation
severity = high
search = index=web sourcetype=access_logs (uri="/register" OR uri="/signup" OR uri="/api/users" OR uri="/create-account") method=POST status=201 | bin _time span=1h | stats count as new_accounts, dc(src_ip) as unique_ips by dest_ip, _time | where new_accounts > 20 OR (new_accounts > 5 AND unique_ips < 3)
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-IDM-13"]
mitre = ["T1136.001"]
compliance = ["PCI-DSS-8.5", "GDPR-25-005", "NIST-AC-2"]
risk_score = 60

[SPL-IDM-014]
name = WSTG-IDM-14: Separation of Duties Violation Detection
description = Detects users performing conflicting roles that violate separation of duties policies
severity = high
search = index=web sourcetype=access_logs | regex _raw="(?i)(user.*=|auth.*user)" | eval user=if(match(_raw, "user=([\w@.]+)"), replace(_raw, ".*user=([\w@.]+).*", "\1"), "unknown") | stats dc(uri) as unique_actions, values(uri) as actions by user, role | eventstats values(role) as all_roles by user | where mvcount(all_roles) > 1 AND (match(all_roles, "admin") AND match(all_roles, "auditor")) OR (match(all_roles, "creator") AND match(all_roles, "approver"))
sourcetype = access_logs
action = email
references = ["WSTG-IDM-14"]
mitre = ["T1078"]
compliance = ["PCI-DSS-8.5", "NIST-AC-5", "HIPAA-WS-001"]
risk_score = 65

[SPL-IDM-015]
name = WSTG-IDM-15: Identity Provider Federation Abuse Detection
description = Detects abuse of federated identity providers through SAML assertion manipulation and OAuth token anomalies
severity = high
search = index=web sourcetype=access_logs (uri="/saml/consume" OR uri="/oauth/authorize" OR uri="/oauth/token" OR uri="/auth/saml" OR uri="/auth/oidc" OR uri="/.well-known/openid-configuration") | regex _raw="(?i)(SAMLResponse|SAMLRequest|assertion.*=|RelayState|issuer.*=|audience.*=)" | stats count, dc(src_ip) as unique_sources by dest_ip | where count > 100 OR unique_sources > 20
sourcetype = access_logs
action = email
references = ["WSTG-IDM-15", "WSTG-ATHN-46"]
mitre = ["T1552.005", "T1606"]
compliance = ["PCI-DSS-8.5", "NIST-IA-2"]
risk_score = 65

[SPL-IDM-016]
name = WSTG-IDM-16: Database Credential Exposure via Error Messages
description = Detects database credential and connection string exposure through application error messages
severity = critical
search = index=web (sourcetype=apache:error OR sourcetype=nginx:error OR sourcetype=access_logs) | regex _raw="(?i)(connection.*string.*=|jdbc:|mongodb://.*:.*@|postgres://.*:.*@|redis://.*:.*@|password=|secret_key=|api_key=|private_key=|AUTHENTICATE.*FAILURE|Login failed.*user|Access denied.*password|FATAL.*password|psql:.*FATAL)" | stats count, values(uri) as error_pages by src_ip, dest_ip | where count > 0
sourcetype = apache:error,nginx:error,access_logs
action = email
references = ["WSTG-IDM-16", "WSTG-ATHN-55"]
mitre = ["T1552", "T1592.002"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-001"]
risk_score = 90

[SPL-IDM-017]
name = WSTG-IDM-17: Password Reset Token Enumeration Detection
description = Detects password reset token enumeration through multiple reset attempts or predictable token patterns
severity = high
search = index=web sourcetype=access_logs (uri="/password-reset*" OR uri="/forgot-password*" OR uri="/api/auth/reset*") method=POST | bin _time span=15m | stats count as reset_attempts, dc(user) as unique_users by src_ip, _time | where reset_attempts > 10 OR (unique_users > 5 AND reset_attempts/unique_users < 2)
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-IDM-17", "WSTG-ATHN-09"]
mitre = ["T1110"]
compliance = ["PCI-DSS-8.5", "NIST-IA-5"]
risk_score = 65

[SPL-IDM-018]
name = WSTG-IDM-18: PII Leakage in Authentication Error Messages
description = Detects PII exposure through authentication error messages that reveal user details, email validity, or account status
severity = high
search = index=web sourcetype=access_logs (uri="/login" OR uri="/auth/login" OR uri="/api/auth") | regex _raw="(?i)(user.*not.*found|email.*not.*registered|account.*does.*not.*exist|invalid.*username|no.*account.*with|password.*incorrect.*for|account.*locked|account.*disabled|email.*already.*exists|username.*taken)" | stats count by src_ip, dest_ip, status | where count > 5
sourcetype = access_logs
action = log
references = ["WSTG-IDM-18", "WSTG-ATHN-14"]
mitre = ["T1592.004", "T1110.001"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-007"]
risk_score = 55

[SPL-IDM-019]
name = WSTG-IDM-19: Credential Data in Source Code Repository Detection
description = Detects credential and secret exposure in source code repositories accessible via web
severity = critical
search = index=web (sourcetype=access_logs OR sourcetype=apache:access) (uri="*.git/*" OR uri="*.svn/*" OR uri="*/.git/config" OR uri="*/.git/HEAD" OR uri="*/.svn/wc.db" OR uri="*/.hg/*" OR uri="*/CVS/*" OR uri="*/.DS_Store" OR uri="*/source*" OR uri="*/repo*") status>=200 status<400 | regex uri="(\.git|\.svn|\.hg|CVS)" | stats count, values(uri) as repo_files by src_ip, dest_ip | sort -count
sourcetype = access_logs,apache:access
action = email
references = ["WSTG-IDM-19", "WSTG-ATHN-50"]
mitre = ["T1552"]
compliance = ["PCI-DSS-6.5", "GDPR-32A-001"]
risk_score = 90

[SPL-IDM-020]
name = WSTG-IDM-20: Kubernetes Secret Exposure Detection
description = Detects access to Kubernetes secrets and configuration maps that may contain authentication credentials
severity = critical
search = index=infrastructure sourcetype=kube:audit | regex _raw="(?i)(get.*secrets|list.*secrets|create.*secrets|update.*secrets|delete.*secrets|get.*configmaps|list.*configmaps|exec.*pod|attach.*pod|port-forward)" | eval action=if(match(_raw, "(?i)get.*secrets|list.*secrets"), "read_secrets", "other") | stats count, values(action) as actions by user, namespace, resource | where match(actions, "read_secrets")
sourcetype = kube:audit
action = email
references = ["WSTG-IDM-20", "WSTG-ATHN-59"]
mitre = ["T1552.007"]
compliance = ["PCI-DSS-8.6", "NIST-IA-5"]
risk_score = 95

[SPL-IDM-021]
name = WSTG-IDM-21: Container Environment Variable Credential Exposure
description = Detects credential exposure through container environment variables and Docker API access
severity = critical
search = index=infrastructure sourcetype=docker:log OR sourcetype=kube:audit | regex _raw="(?i)(PASSWORD|SECRET|API_KEY|TOKEN|PRIVATE_KEY|ACCESS_KEY|AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|DATABASE_URL|MONGO_URL|REDIS_URL|POSTGRES_PASSWORD|MYSQL_ROOT_PASSWORD)" | stats count, values(container_name) as containers by src_ip, host | where count > 0
sourcetype = docker:log,kube:audit
action = email
references = ["WSTG-IDM-21", "WSTG-ATHN-58"]
mitre = ["T1552.007"]
compliance = ["PCI-DSS-3.4", "NIST-IA-5"]
risk_score = 90

[SPL-IDM-022]
name = WSTG-IDM-22: Cloud Provider Credential Exposure Detection
description = Detects exposed cloud provider credentials (AWS, GCP, Azure) in logs, code repositories, or web responses
severity = critical
search = index=* (sourcetype=access_logs OR sourcetype=github OR sourcetype=gitlab) | regex _raw="(?i)(AKIA[A-Z0-9]{16}|AIza[A-Za-z0-9_\\-]{35}|ya29\.[A-Za-z0-9_\\-]+|eyJ[A-Za-z0-9_\\-]+\\.eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+|-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----)" | stats count, values(sourcetype) as sources by src_ip, dest_ip | where count > 0
sourcetype = access_logs,github,gitlab
action = email
references = ["WSTG-IDM-22"]
mitre = ["T1552", "T1558"]
compliance = ["PCI-DSS-8.6", "GDPR-32A-001", "NIST-IA-5"]
risk_score = 95

[SPL-IDM-023]
name = WSTG-IDM-23: OAuth/OIDC Token Theft Detection
description = Detects OAuth and OIDC token theft through abnormal token usage patterns, token replay, and suspicious redirect URIs
severity = critical
search = index=web sourcetype=access_logs (uri="/oauth/token" OR uri="/oauth/authorize" OR uri="/oidc/token" OR uri="/.well-known/openid-configuration") | regex _raw="(?i)(redirect_uri.*=.*evil|redirect_uri.*=.*\.local|redirect_uri.*=.*127\.0\.0\.1|token.*reuse|code.*reuse|state.*missing|nonce.*missing)" | stats count, dc(src_ip) as unique_ips by dest_ip | where count > 5 OR unique_ips > 3
sourcetype = access_logs
action = email
references = ["WSTG-IDM-23", "WSTG-ATHZ-05"]
mitre = ["T1552.005", "T1606"]
compliance = ["PCI-DSS-8.3", "NIST-IA-2"]
risk_score = 85

[SPL-IDM-024]
name = WSTG-IDM-024: SAML Assertion Manipulation Detection
description = Detects SAML assertion manipulation including signature exclusion, replay attacks, and assertion injection
severity = critical
search = index=web sourcetype=access_logs | regex _raw="(?i)(SAMLResponse.*=|SAMLRequest.*=)" | regex _raw="(?i)(Signature.*null|Signature.*empty|NotOnOrAfter.*expired|Audience.*mismatch|InResponseTo.*missing|AssertionID.*duplicate)" | stats count, dc(src_ip) as unique_sources by dest_ip | where count > 3
sourcetype = access_logs
action = email
references = ["WSTG-ATHN-46"]
mitre = ["T1606.002"]
compliance = ["PCI-DSS-8.3", "NIST-IA-2"]
risk_score = 90

[SPL-IDM-025]
name = WSTG-IDM-025: JWT Algorithm Confusion Attack Detection
description = Detects JWT algorithm confusion attacks where attackers switch algorithm from RS256 to HS256
severity = critical
search = index=web sourcetype=access_logs | regex _raw="(?i)(eyJ[A-Za-z0-9_\\-]+\\.eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+)" | rex field=_raw "eyJ(?<jwt_header>[A-Za-z0-9_\\-]+)\\.eyJ" | eval jwt_decoded=base64decode(jwt_header) | where match(jwt_decoded, "(?i)\"alg\"\\s*:\\s*\"HS256\"") | stats count by src_ip, dest_ip | where count > 5
sourcetype = access_logs
action = email
references = ["WSTG-SESS-10", "WSTG-ATHN-54"]
mitre = ["T1606.001"]
compliance = ["PCI-DSS-8.3", "NIST-IA-2"]
risk_score = 90