# =============================================================================
# Splunk SIEM Alert Rules — wstg-04-06
# =============================================================================

[SPL-WSTG04-001]
name = Credentials Transmitted Over Unencrypted Channel
description = Detects login or credential submission over HTTP instead of HTTPS exposing credentials to interception
severity = critical
search = index=* ("authentication" OR "cleartext-credentials" OR "encryption") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = WSTG04-001
mitre = T1041
compliance = PCI-DSS-4.1,GDPR-32A-002,HIPAA-TS-001
risk_score = 90

