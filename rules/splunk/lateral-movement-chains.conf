# =============================================================================
# Splunk SIEM Alert Rules — lateral-movement-chains
# Multi-stage lateral movement detection and kill chain correlation
# =============================================================================

[SPL-LMC-001]
name = Lateral Chain — Initial Access to Lateral Movement in 30 Minutes
description = Detects rapid transition from initial compromise to lateral movement within a 30-minute window
severity = critical
search = index=* sourcetype=auth_logs action=authentication success | eval stage="initial_access" | append [search index=* sourcetype=access_logs action=remote_access | eval stage="lateral_movement"] | transaction src_ip maxspan=30m | where mvcount(stage) > 1 AND mvfind(stage, "initial_access") > 0 AND mvfind(stage, "lateral_movement") > 0 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = auth_logs,access_logs,firewall
action = email
references = LMC-001
mitre = T1190,T1021
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 90

[SPL-LMC-002]
name = Lateral Chain — Credential Dumping Followed by Remote Execution
description = Detects credential dumping followed by remote command execution on other systems
severity = critical
search = index=* (sourcetype=windows_security EventCode=4656 OR EventCode=4663) process_name IN ("mimikatz","lsass.exe","procdump.exe","reg.exe") | eval stage="credential_dumping" | append [search index=* sourcetype=windows_security (EventCode=4688 OR EventCode=1) process_name IN ("psexec.exe","wmic.exe","winrs.exe","powershell.exe") | eval stage="remote_execution"] | transaction src_ip maxspan=1h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-002
mitre = T1003,T1021
compliance = PCI-DSS-8.5,NIST-IA-5
risk_score = 90

[SPL-LMC-003]
name = Lateral Chain — Discovery to Exploitation Sequence
description = Detects network discovery followed by exploitation of discovered services across multiple hosts
severity = critical
search = index=* sourcetype=network_logs (action=port_scan OR action=service_enum) | eval stage="discovery" | append [search index=* sourcetype=access_logs (action=exploit OR action=vulnerability_exploit) | eval stage="exploitation"] | transaction src_ip maxspan=2h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = network_logs,access_logs
action = email
references = LMC-003
mitre = T1046,T1210
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 90

[SPL-LMC-004]
name = Lateral Chain — Phishing Click to Internal Lateral Movement
description = Detects phishing email click followed by internal lateral movement within 24 hours
severity = critical
search = index=* sourcetype=email_logs action=phishing_click | eval stage="phishing_click" | append [search index=* sourcetype=auth_logs action=authentication success | where src_ip NOT IN (known_user_ips) | eval stage="lateral_movement"] | transaction user maxspan=24h | where mvcount(stage) > 1 | stats count, values(user) as users, values(src_ip) as src_ips by rule_id
sourcetype = email_logs,auth_logs
action = email
references = LMC-004
mitre = T1566,T1021
compliance = PCI-DSS-5.3,NIST-AT-2
risk_score = 90

[SPL-LMC-005]
name = Lateral Chain — RDP Escalation to Domain Admin
description = Detects RDP lateral movement that escalates to domain admin privileges
severity = critical
search = index=* sourcetype=windows_security EventCode=4624 LogonType=10 | eval stage="rdp_lateral" | append [search index=* sourcetype=windows_security (EventCode=4672 OR EventCode=4624) user_role IN ("domain_admin","enterprise_admin") | eval stage="privilege_escalation"] | transaction src_ip user maxspan=2h | where mvcount(stage) > 1 | stats count, values(user) as users, values(src_ip) as src_ips by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-005
mitre = T1021.001,T1548
compliance = PCI-DSS-8.5,NIST-AC-6
risk_score = 90

[SPL-LMC-006]
name = Lateral Chain — SSH Key Lateral Movement
description = Detects SSH key-based lateral movement across multiple hosts in sequence
severity = high
search = index=* sourcetype=auth_logs action=ssh_login success auth_method="publickey" | sort 0 _time | streamstats last(dest_ip) as prev_dest by src_ip user | where dest_ip!=prev_dest AND dest_ip!=src_ip | stats dc(dest_ip) as lateral_hosts, values(dest_ip) as dest_ips by src_ip user | where lateral_hosts > 3
sourcetype = auth_logs,access_logs
action = email
references = LMC-006
mitre = T1021.004,T1078
compliance = PCI-DSS-1.3,NIST-AC-17
risk_score = 70

[SPL-LMC-007]
name = Lateral Chain — WMI to PowerShell Remote Execution Chain
description = Detects WMI lateral movement followed by PowerShell remote execution on target systems
severity = critical
search = index=* sourcetype=windows_security (EventCode=4688 OR EventCode=1) process_name IN ("wmiprvse.exe","wmic.exe") | eval stage="wmi_lateral" | append [search index=* sourcetype=windows_security (EventCode=4688 OR EventCode=1) process_name="powershell.exe" command_line="*Enter-PSSession* OR *Invoke-Command*" | eval stage="ps_remote"] | transaction src_ip dest_ip maxspan=30m | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-007
mitre = T1047,T1059.001
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 90

[SPL-LMC-008]
name = Lateral Chain — SMB Admin Share to Service Installation
description = Detects lateral movement via SMB admin shares followed by remote service installation
severity = critical
search = index=* sourcetype=windows_security EventCode=5140 ShareName IN ("C$","ADMIN$","IPC$") | eval stage="smb_admin_share" | append [search index=* sourcetype=windows_security (EventCode=7045 OR EventCode=4697) | eval stage="service_install"] | transaction src_ip dest_ip maxspan=1h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = windows_security,system_logs
action = email
references = LMC-008
mitre = T1021.002,T1543.003
compliance = PCI-DSS-1.3,NIST-AC-17
risk_score = 90

[SPL-LMC-009]
name = Lateral Chain — Kerberoasting to Pass-the-Ticket
description = Detects Kerberoasting attack followed by pass-the-ticket lateral movement
severity = critical
search = index=* sourcetype=windows_security EventCode=4769 | where match(service_name,"(?i)^(MSSQL|HTTP|HOST|CIFS)") AND ticket_encryption_type=0x17 | eval stage="kerberoasting" | append [search index=* sourcetype=windows_security (EventCode=4624 OR EventCode=4625) LogonType=3 auth_package="Kerberos" | where dest_ip!=src_ip | eval stage="ptt_lateral"] | transaction src_ip maxspan=6h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(user) as users by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-009
mitre = T1558.003,T1550.003
compliance = PCI-DSS-8.5,NIST-IA-2
risk_score = 90

[SPL-LMC-010]
name = Lateral Chain — DCOM to Scheduled Task Persistence
description = Detects DCOM lateral movement followed by scheduled task creation for persistence
severity = high
search = index=* sourcetype=windows_security (EventCode=4688 OR EventCode=1) process_name IN ("mmc.exe","dcomlaunch.exe") parent_process_name="svchost.exe" | eval stage="dcom_lateral" | append [search index=* sourcetype=windows_security (EventCode=4698 OR EventCode=4699 OR EventCode=4700 OR EventCode=4701 OR EventCode=4702) | eval stage="scheduled_task"] | transaction src_ip dest_ip maxspan=1h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = windows_security,system_logs
action = email
references = LMC-010
mitre = T1021.003,T1053.005
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 70

[SPL-LMC-011]
name = Lateral Chain — Pass-the-Hash to RDP Persistence
description = Detects NTLM pass-the-hash attack followed by RDP session establishment for persistent access
severity = critical
search = index=* sourcetype=windows_security EventCode=4624 LogonType=3 auth_package="NTLM" | where match(auth_package,"(?i)NTLM") AND user NOT IN ("ANONYMOUS LOGON","SYSTEM") | eval stage="pth_attack" | append [search index=* sourcetype=windows_security EventCode=4624 LogonType=10 | eval stage="rdp_session"] | transaction src_ip user maxspan=2h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(user) as users by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-011
mitre = T1550.002,T1021.001
compliance = PCI-DSS-8.5,NIST-IA-2
risk_score = 90

[SPL-LMC-012]
name = Lateral Chain — VPN Compromise to Internal Lateral Movement
description = Detects compromised VPN session followed by lateral movement within internal network
severity = critical
search = index=* sourcetype=vpn_logs action=authentication success | where src_ip NOT IN (known_vpn_ips) OR match(user_agent,"(?i)(suspicious|unusual|unknown)") | eval stage="vpn_compromise" | append [search index=* sourcetype=auth_logs action=authentication success dest_zone="internal" | eval stage="lateral_movement"] | transaction user maxspan=4h | where mvcount(stage) > 1 | stats count, values(user) as users, values(src_ip) as src_ips by rule_id
sourcetype = vpn_logs,auth_logs
action = email
references = LMC-012
mitre = T1190,T1021
compliance = PCI-DSS-1.3,NIST-AC-17
risk_score = 90

[SPL-LMC-013]
name = Lateral Chain — Credential Reuse Across Multiple Systems
description = Detects the same credentials used across multiple systems indicating credential reuse in lateral movement
severity = high
search = index=* sourcetype=auth_logs action=authentication success | bucket _time span=1h | stats dc(dest_host) as host_count, values(dest_host) as dest_hosts by user src_ip _time | where host_count > 5
sourcetype = auth_logs,access_logs
action = email
references = LMC-013
mitre = T1078
compliance = PCI-DSS-8.5,NIST-AC-3
risk_score = 70

[SPL-LMC-014]
name = Lateral Chain — Web Shell to Internal Reconnaissance
description = Detects web shell upload followed by internal reconnaissance commands
severity = critical
search = index=* sourcetype=access_logs action=file_upload | where match(file_name,"(?i)(\\.php|\\.jsp|\\.asp|\\.aspx)$") AND match(file_content,"(?i)(cmd|exec|system|shell|passthru|eval|base64_decode)") | eval stage="webshell_upload" | append [search index=* sourcetype=access_logs uri_path="*webshell_path*" | where match(response_body,"(?i)(ipconfig|ifconfig|net.{0,10}(user|group|share|localgroup)|whoami|hostname|systeminfo|nmap|nslookup|ping)") | eval stage="reconnaissance"] | transaction src_ip maxspan=1h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = access_logs,web_logs
action = email
references = LMC-014
mitre = T1190,T1087,T1046
compliance = PCI-DSS-6.5,NIST-CM-7
risk_score = 90

[SPL-LMC-015]
name = Lateral Chain — PowerShell Encoded Command to Lateral Movement
description = Detects encoded PowerShell commands followed by lateral movement to other systems
severity = critical
search = index=* sourcetype=windows_security (EventCode=4688 OR EventCode=1) process_name="powershell.exe" | where match(command_line,"(?i)(-enc|-encodedcommand|frombase64string)") | eval stage="encoded_ps" | append [search index=* sourcetype=auth_logs action=authentication success | where src_ip!=dest_ip | eval stage="lateral_movement"] | transaction src_ip maxspan=2h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-015
mitre = T1059.001,T1021
compliance = PCI-DSS-6.5,NIST-CM-7
risk_score = 90

[SPL-LMC-016]
name = Lateral Chain — DLL Injection to Remote Service Creation
description = Detects DLL injection followed by remote service creation for lateral movement
severity = critical
search = index=* sourcetype=windows_security EventCode=8 | where match(TargetImage,"(?i)(svchost|lsass|csrss|services)") | eval stage="dll_injection" | append [search index=* sourcetype=windows_security (EventCode=7045 OR EventCode=4697) | where src_ip!=dest_ip | eval stage="remote_service"] | transaction src_ip maxspan=2h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = windows_security,system_logs
action = email
references = LMC-016
mitre = T1055.001,T1543.003
compliance = PCI-DSS-5.3,NIST-SI-4
risk_score = 90

[SPL-LMC-017]
name = Lateral Chain — DNS Tunneling to Data Exfiltration
description = Detects DNS tunneling activity followed by data exfiltration through the same channel
severity = critical
search = index=* sourcetype=dns_logs | where match(query, "(?i)([a-z0-9]{20,}\\.|[a-z0-9]+\\.[a-z]{2,}\\.[a-z]{2,})") AND len(query) > 50 | eval stage="dns_tunnel" | append [search index=* sourcetype=network_logs bytes_out > 10000000 dest_port=53 | eval stage="exfiltration"] | transaction src_ip maxspan=4h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips by rule_id
sourcetype = dns_logs,network_logs
action = email
references = LMC-017
mitre = T1071.004,T1048
compliance = PCI-DSS-1.3,GDPR-25-008
risk_score = 90

[SPL-LMC-018]
name = Lateral Chain — Service Account Abuse to Domain Privilege Escalation
description = Detects service account credential abuse followed by privilege escalation to domain admin
severity = critical
search = index=* sourcetype=auth_logs action=authentication success user_type="service" | where src_ip NOT IN (service_known_ips) | eval stage="service_abuse" | append [search index=* sourcetype=windows_security EventCode=4672 user_role IN ("domain_admin","enterprise_admin") | eval stage="privilege_escalation"] | transaction src_ip maxspan=4h | where mvcount(stage) > 1 | stats count, values(user) as users, values(src_ip) as src_ips by rule_id
sourcetype = auth_logs,windows_security
action = email
references = LMC-018
mitre = T1078.002,T1548
compliance = PCI-DSS-8.5,NIST-AC-6
risk_score = 90

[SPL-LMC-019]
name = Lateral Chain — Brute Force to Account Takeover to Lateral Movement
description = Detects brute force attack on one account followed by successful takeover and lateral movement
severity = critical
search = index=* sourcetype=auth_logs action=authentication failure | bucket _time span=15m | stats count as failures by user src_ip _time | where failures > 10 | eval stage="brute_force" | append [search index=* sourcetype=auth_logs action=authentication success | eval stage="account_takeover"] | transaction user maxspan=2h | where mvcount(stage) > 1 | stats count, values(user) as users, values(src_ip) as src_ips by rule_id
sourcetype = auth_logs,access_logs
action = email
references = LMC-019
mitre = T1110,T1078,T1021
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-LMC-020]
name = Lateral Chain — Golden Ticket to Persistent Access
description = Detects Kerberos Golden Ticket activity indicating persistent domain-level access
severity = critical
search = index=* sourcetype=windows_security EventCode=4768 OR EventCode=4769 | where ticket_lifetime > 600 OR match(ticket_encryption_type,"0x17") | eval stage="golden_ticket" | append [search index=* sourcetype=auth_logs action=authentication success auth_type="Kerberos" | eval stage="persistent_access"] | transaction user maxspan=24h | where mvcount(stage) > 1 | stats count, values(user) as users by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-020
mitre = T1558.001
compliance = PCI-DSS-8.5,NIST-IA-2
risk_score = 90

[SPL-LMC-021]
name = Lateral Chain — Cloud Instance Metadata to Lateral Movement
description = Detects SSRF targeting cloud metadata API followed by lateral movement using stolen credentials
severity = critical
search = index=* sourcetype=access_logs | where match(uri_path, "(?i)(169\\.254\\.169\\.254|metadata\\.google|metadata\\.azure)") | eval stage="ssrf_metadata" | append [search index=* sourcetype=auth_logs action=authentication success | where user IN (cloud_service_accounts) AND src_ip NOT IN (known_cloud_ips) | eval stage="lateral_movement"] | transaction src_ip maxspan=2h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips by rule_id
sourcetype = access_logs,auth_logs
action = email
references = LMC-021
mitre = T1190,T1078
compliance = PCI-DSS-6.5,NIST-AC-4
risk_score = 90

[SPL-LMC-022]
name = Lateral Chain — Scheduled Task to Credential Harvesting
description = Detects remote scheduled task creation followed by credential harvesting on target systems
severity = high
search = index=* sourcetype=windows_security (EventCode=4698 OR EventCode=4702) | where src_ip!=dest_ip | eval stage="scheduled_task" | append [search index=* sourcetype=windows_security (EventCode=4656 OR EventCode=4663) process_name IN ("mimikatz.exe","lsass.exe","procdump.exe") | eval stage="credential_harvest"] | transaction dest_ip maxspan=4h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = windows_security,system_logs
action = email
references = LMC-022
mitre = T1053.005,T1003
compliance = PCI-DSS-8.5,NIST-IA-5
risk_score = 70

[SPL-LMC-023]
name = Lateral Chain — Lateral Movement via Unusual Port
description = Detects lateral movement through unusual or non-standard ports indicating covert channels
severity = high
search = index=* sourcetype=network_logs action=connection_established src_zone="internal" dest_zone="internal" | where dest_port NOT IN (22,80,443,3389,445,135,5985,5986,3306,5432,1433,27017) AND dest_port < 49152 | bucket _time span=5m | stats count as connections, dc(dest_port) as port_count by src_ip dest_ip _time | where connections > 10 AND port_count > 3
sourcetype = network_logs,firewall
action = email
references = LMC-023
mitre = T1571,T1021
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 70

[SPL-LMC-024]
name = Lateral Chain — Living-off-the-Land Binary Abuse Chain
description = Detects chains of LOLbin (living-off-the-land binary) abuse for multi-stage lateral movement
severity = high
search = index=* sourcetype=windows_security (EventCode=4688 OR EventCode=1) | where process_name IN ("certutil.exe","bitsadmin.exe","mshta.exe","wmic.exe","powershell.exe","cmd.exe","rundll32.exe","regsvr32.exe","msiexec.exe","cmstp.exe","mavinject.exe","control.exe") | eval lolbin_stage=process_name | sort 0 _time | streamstats last(lolbin_stage) as prev_stage by src_ip | where lolbin_stage != prev_stage | bucket _time span=5m | stats dc(lolbin_stage) as stage_count, values(lolbin_stage) as stages by src_ip _time | where stage_count > 3
sourcetype = windows_security,system_logs
action = email
references = LMC-024
mitre = T1059,T1218
compliance = PCI-DSS-5.3,NIST-CM-7
risk_score = 70

[SPL-LMC-025]
name = Lateral Chain — Zero Trust Violation — Cross-Segment Movement
description = Detects lateral movement across network segments that violates zero-trust segmentation policies
severity = critical
search = index=* sourcetype=network_logs action=connection_established | eval src_segment=case(match(src_ip,"^10\\.1\\."), "segment_a", match(src_ip,"^10\\.2\\."), "segment_b", match(src_ip,"^10\\.3\\."), "segment_c", 1=1, "unknown") | eval dest_segment=case(match(dest_ip,"^10\\.1\\."), "segment_a", match(dest_ip,"^10\\.2\\."), "segment_b", match(dest_ip,"^10\\.3\\."), "segment_c", 1=1, "unknown") | where src_segment != dest_segment AND src_segment != "unknown" AND dest_segment != "unknown" | lookup segment_policy src_segment dest_segment OUTPUT allowed | where allowed=0 OR isnull(allowed) | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = network_logs,firewall
action = email
references = LMC-025
mitre = T1021
compliance = PCI-DSS-1.3,NIST-AC-4
risk_score = 90

[SPL-LMC-026]
name = Lateral Chain — Exploit Kit to Ransomware Deployment
description = Detects initial exploit kit infection followed by ransomware deployment across the network
severity = critical
search = index=* sourcetype=access_logs | where match(uri_path, "(?i)(/(wp-content|uploads|tmp)/.*\\.(php|jsp|asp)|exploit|payload|dropper)") OR match(response_body, "(?i)(meterpreter|reverse_shell|webshell)") | eval stage="exploit_kit" | append [search index=* sourcetype=system_logs | where match(process_name, "(?i)(vssadmin|wbadmin|bcdedit|wbadmin|icacls|cipher|cacls)") AND match(command_line, "(?i)(delete|shadow|recovery|encrypt)") | eval stage="ransomware"] | transaction src_ip maxspan=6h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = access_logs,system_logs
action = email
references = LMC-026
mitre = T1190,T1486
compliance = PCI-DSS-6.5,PCI-DSS-3.4
risk_score = 90

[SPL-LMC-027]
name = Lateral Chain — Cobalt Strike Beacon to C2 Communication
description = Detects Cobalt Strike beacon activity followed by command and control communication patterns
severity = critical
search = index=* sourcetype=network_logs | where match(user_agent, "(?i)(cobalt|beacon)") OR match(uri_path, "(?i)(/[a-zA-Z0-9]{4,8})$") AND match(response_code, "^(200|404|403)$") AND dest_port IN (80,443,8080,8443) | eval stage="beacon" | append [search index=* sourcetype=network_logs bytes_out > 50000 bytes_in < 1000 dest_port IN (80,443) | bucket _time span=1h | stats sum(bytes_out) as total_out, sum(bytes_in) as total_in by src_ip dest_ip _time | where total_out/total_in > 10 | eval stage="c2_comm")] | transaction src_ip maxspan=12h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips by rule_id
sourcetype = network_logs,firewall
action = email
references = LMC-027
mitre = T1071.001
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 90

[SPL-LMC-028]
name = Lateral Chain — Internal Phishing to Credential Harvesting
description = Detects internal phishing emails followed by credential harvesting on compromised accounts
severity = critical
search = index=* sourcetype=email_logs action=email_sent | where match(email_subject, "(?i)(password|reset|verify|urgent|account.{0,10}(locked|suspended))") AND sender_zone="internal" | eval stage="internal_phish" | append [search index=* sourcetype=auth_logs action=authentication success | where match(uri_path, "(?i)(login|signin|auth|sso)") AND src_ip NOT IN (known_login_ips) | eval stage="credential_harvest"] | transaction user maxspan=4h | where mvcount(stage) > 1 | stats count, values(user) as users, values(sender) as senders by rule_id
sourcetype = email_logs,auth_logs
action = email
references = LMC-028
mitre = T1566.001,T1110
compliance = PCI-DSS-5.3,NIST-AT-2
risk_score = 90

[SPL-LMC-029]
name = Lateral Chain — Container Escape to Host Lateral Movement
description = Detects container breakout followed by lateral movement from the host to other systems
severity = critical
search = index=* sourcetype=container_logs | where match(event, "(?i)(escape|breakout|privileged|host_pid|host_network|mount|docker\\.sock)") | eval stage="container_escape" | append [search index=* sourcetype=auth_logs action=authentication success | where src_ip IN (container_host_ips) AND dest_ip NOT IN (container_host_ips) | eval stage="host_lateral"] | transaction src_ip maxspan=1h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(container_id) as containers by rule_id
sourcetype = container_logs,auth_logs
action = email
references = LMC-029
mitre = T1611,T1021
compliance = PCI-DSS-1.3,NIST-CM-7
risk_score = 90

[SPL-LMC-030]
name = Lateral Chain — Cloud API Compromise to Cross-Account Movement
description = Detects compromised cloud API credentials used for lateral movement across cloud accounts
severity = critical
search = index=* sourcetype=cloud_audit action=AssumeRole OR action=SwitchRole | where match(user_identity, "(?i)(compromised|suspicious|unknown)") OR src_ip NOT IN (known_cloud_ips) | eval stage="api_compromise" | append [search index=* sourcetype=cloud_audit action IN (RunInstance","CreateSnapshot","PutObject","GetObject","ListBuckets") | where src_account_id != dest_account_id | eval stage="cross_account_lateral")] | transaction src_ip maxspan=4h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(src_account_id) as src_accounts by rule_id
sourcetype = cloud_audit,access_logs
