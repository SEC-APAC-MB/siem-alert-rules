[SPL-LMC-031]
name = Lateral Chain — BloodHound Recon to Privilege Escalation
description = Detects BloodHound AD reconnaissance activity followed by privilege escalation attacks
severity = high
search = index=* sourcetype=windows_security | where match(process_name, "(?i)(bloodhound|sharpbloodhound|bloodhound)") OR match(command_line, "(?i)(bloodhound|sharphound|getnet|getdomain|getacl)") | eval stage="bloodhound_recon" | append [search index=* sourcetype=windows_security EventCode=4672 | where user NOT IN (known_admins) | eval stage="privilege_escalation"] | transaction src_ip maxspan=8h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(user) as users by rule_id
sourcetype = windows_security,auth_logs
action = email
references = LMC-031
mitre = T1087.002,T1548
compliance = PCI-DSS-8.5,NIST-AC-6
risk_score = 70

[SPL-LMC-032]
name = Lateral Chain — LSASS Access to Credential Reuse
description = Detects LSASS memory access followed by credential reuse across multiple systems
severity = critical
search = index=* sourcetype=windows_security EventCode=4656 OR EventCode=4663 | where match(object_name, "(?i)(lsass)") AND match(process_name, "(?i)(mimikatz|procdump|taskmgr|rundll32|comsvcs)") | eval stage="lsass_access" | append [search index=* sourcetype=auth_logs action=authentication success | bucket _time span=1h | stats dc(dest_host) as host_count by user src_ip _time | where host_count > 3 | eval stage="credential_reuse")] | transaction src_ip user maxspan=4h | where mvcount(stage) > 1 | stats count, values(src_ip) as src_ips, values(user) as users by rule_id
sourcetype = windows_security,auth_logs
action = email
