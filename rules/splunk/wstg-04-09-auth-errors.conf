# =============================================================================
# Splunk SIEM Alert Rules — wstg-04-09-auth-errors
# Authentication error patterns: brute force, credential stuffing, MFA bypass,
# account lockout, and related auth failure detection
# =============================================================================

[SPL-AUTH-001]
name = Brute Force — High-Rate Login Failures Single Account
description = Detects rapid successive failed login attempts targeting a single account exceeding 10 failures in 5 minutes
severity = critical
search = index=* sourcetype=auth_logs action=authentication failure | bucket _time span=5m | stats count as failures, dc(src_ip) as src_ip_count by user _time | where failures > 10
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-001
mitre = T1110.001
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-002]
name = Brute Force — Distributed Login Failures Across Accounts
description = Detects password spray attacks with the same password tried against many accounts from a single source
severity = critical
search = index=* sourcetype=auth_logs action=authentication failure | bucket _time span=15m | stats dc(user) as target_accounts, count as failures by src_ip _time | where target_accounts > 20 AND failures > 50
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-002
mitre = T1110.003
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-003]
name = Brute Force — Slow and Low Login Attempts
description = Detects low-and-slow brute force with login failures below rate-limit thresholds over extended periods
severity = high
search = index=* sourcetype=auth_logs action=authentication failure | bucket _time span=1h | stats count as failures by src_ip user _time | where failures > 3 AND failures < 10 | eventstats sum(failures) as total_failures by src_ip | where total_failures > 30
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-003
mitre = T1110.002
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 70

[SPL-AUTH-004]
name = Credential Stuffing — Known Breached Credential List Detection
description = Detects login attempts using email/password combinations found in known breach databases
severity = critical
search = index=* sourcetype=auth_logs action=authentication (failure OR success) | lookup breached_credentials email OUTPUT is_breached | where is_breached=1 | stats count, values(user) as users by src_ip
sourcetype = auth_logs,access_logs,threat_intel
action = email
references = WSTG04-009,AUTH-004
mitre = T1110.004
compliance = PCI-DSS-8.5,NIST-AC-7,GDPR-32A-002
risk_score = 90

[SPL-AUTH-005]
name = Credential Stuffing — Username Enumeration via Differentiated Error Messages
description = Detects username enumeration attacks revealing valid accounts through differentiated login error messages
severity = high
search = index=* sourcetype=access_logs uri_path="/login" status=401 | eval error_type=if(match(response_body,"user not found|invalid username"),"user_invalid","password_invalid") | stats count by src_ip error_type | where error_type="user_invalid" AND count > 20
sourcetype = access_logs,auth_logs
action = email
references = WSTG04-009,AUTH-005
mitre = T1110.001
compliance = PCI-DSS-6.5,NIST-CM-7
risk_score = 70

[SPL-AUTH-006]
name = Credential Stuffing — High Success Rate After Failed Attempts
description = Detects credential stuffing campaigns showing bursts of failures followed by successful logins
severity = critical
search = index=* sourcetype=auth_logs action=authentication | eval outcome=if(action="success","success","failure") | bucket _time span=1h | stats count as total, count(eval(outcome="failure")) as failures, count(eval(outcome="success")) as successes by src_ip _time | where failures > 15 AND successes > 0
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-006
mitre = T1110.004
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-007]
name = MFA Bypass — Authentication Without MFA Step
description = Detects privileged account authentications that skipped MFA verification indicating MFA bypass or policy violation
severity = critical
search = index=* sourcetype=auth_logs action=authentication success user_role IN (admin,superuser,privileged) | where mfa_verified=0 OR isnull(mfa_verified) | stats count by user src_ip
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-007
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2,HIPAA-ADM-005
risk_score = 90

[SPL-AUTH-008]
name = MFA Bypass — MFA Fatigue Attack (Rapid Push Notifications)
description = Detects MFA push notification fatigue attacks where multiple push notifications are sent in rapid succession
severity = critical
search = index=* sourcetype=auth_logs action=mfa_push | bucket _time span=5m | stats count as push_count by user src_ip _time | where push_count > 10
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-008
mitre = T1111.001
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-009]
name = MFA Bypass — SIM Swap Detection
description = Detects potential SIM swap attacks through phone number changes followed by immediate MFA enrollment
severity = critical
search = index=* sourcetype=auth_logs (action=phone_change OR action=mfa_enrollment) | sort 0 _time | streamstats last(action) as prev_action by user | where action="mfa_enrollment" AND prev_action="phone_change" AND (_time - prev_time) < 3600
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-009
mitre = T1111.002
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-010]
name = MFA Bypass — Token Replay Attack
description = Detects replay of MFA tokens from different IPs or devices indicating stolen MFA tokens
severity = critical
search = index=* sourcetype=auth_logs action=mfa_verify success | stats dc(src_ip) as ip_count, dc(device_id) as device_count by mfa_token_hash | where ip_count > 1 OR device_count > 1
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-010
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-011]
name = MFA Bypass — Downgrade Attack to SMS
description = Detects authentication flows where MFA was downgraded from app-based to SMS-based verification
severity = high
search = index=* sourcetype=auth_logs action=mfa_challenge | eval mfa_type=if(match(mfa_method,"sms|text"),"sms","app") | stats count by user mfa_type src_ip | where mfa_type="sms" AND user IN (admin_users)
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-011
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 70

[SPL-AUTH-012]
name = MFA Bypass — Real-Time Phishing Proxy (Adversary-in-the-Middle)
description = Detects MFA authentication through known phishing proxies indicated by unusual TLS fingerprints or session characteristics
severity = critical
search = index=* sourcetype=auth_logs action=authentication success mfa_verified=1 | where match(user_agent,"(phishing|proxy|mitm|evilginx|modlishka)") OR src_ip IN (known_phishing_proxies) | stats count by user src_ip user_agent
sourcetype = auth_logs,access_logs,threat_intel
action = email
references = WSTG04-009,AUTH-012
mitre = T1111,T1189
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-013]
name = Account Lockout — Mass Lockout Event (Possible DoS)
description = Detects mass account lockouts potentially indicating a denial-of-service attack on authentication
severity = critical
search = index=* sourcetype=auth_logs action=account_lockout | bucket _time span=15m | stats dc(user) as locked_accounts by _time | where locked_accounts > 50
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-013
mitre = T1110.003,T1498
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-014]
name = Account Lockout — Targeted Single Account Lockout
description = Detects targeted account lockout attacks preventing legitimate users from accessing their accounts
severity = high
search = index=* sourcetype=auth_logs action=account_lockout | stats count as lockout_count by user src_ip | where lockout_count > 3
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-014
mitre = T1110.003
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 70

[SPL-AUTH-015]
name = Account Lockout — Admin Account Lockout Anomaly
description = Detects lockout of administrative or service accounts which should rarely if ever be locked out
severity = critical
search = index=* sourcetype=auth_logs action=account_lockout | where user_role IN (admin,superuser,service_account) | stats count by user user_role src_ip
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-015
mitre = T1110.003
compliance = PCI-DSS-8.5,NIST-AC-6
risk_score = 90

[SPL-AUTH-016]
name = Brute Force — SSH Brute Force Attack
description = Detects SSH brute force attacks with rapid failed authentication attempts from a single source
severity = critical
search = index=* sourcetype=auth_logs action=ssh_login failure | bucket _time span=5m | stats count as failures by src_ip _time | where failures > 20
sourcetype = auth_logs,firewall,syslog
action = email
references = WSTG04-009,AUTH-016
mitre = T1110.001
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-017]
name = Brute Force — RDP Brute Force Attack
description = Detects RDP brute force attacks with high volume failed login attempts
severity = critical
search = index=* sourcetype=auth_logs (action=rdp_login OR EventCode=4625) LogonType=10 | bucket _time span=5m | stats count as failures by src_ip dest_ip _time | where failures > 15
sourcetype = auth_logs,firewall,windows_security
action = email
references = WSTG04-009,AUTH-017
mitre = T1110.001
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-018]
name = Brute Force — VPN Credential Stuffing
description = Detects credential stuffing attacks against VPN concentrators with rapid successive failures
severity = critical
search = index=* sourcetype=vpn_logs action=authentication failure | bucket _time span=10m | stats count as failures, dc(user) as unique_users by src_ip _time | where failures > 30 AND unique_users > 10
sourcetype = vpn_logs,auth_logs
action = email
references = WSTG04-009,AUTH-018
mitre = T1110.004
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-019]
name = Brute Force — API Authentication Brute Force
description = Detects brute force attacks against API authentication endpoints with high failure rates
severity = critical
search = index=* sourcetype=access_logs uri_path="/api/auth*" status=401 | bucket _time span=5m | stats count as failures, dc(user) as unique_users by src_ip _time | where failures > 50
sourcetype = access_logs,api_logs
action = email
references = WSTG04-009,AUTH-019
mitre = T1110.001
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-020]
name = Brute Force — WordPress XML-RPC Amplification
description = Detects WordPress XML-RPC multicall authentication brute force amplification attacks
severity = critical
search = index=* sourcetype=access_logs uri_path="/xmlrpc.php" method=POST | where match(request_body,"system\.multicall|wp\.getProfile") | stats count as attempts by src_ip | where attempts > 5
sourcetype = access_logs,web_logs
action = email
references = WSTG04-009,AUTH-020
mitre = T1110.003
compliance = PCI-DSS-8.5
risk_score = 90

[SPL-AUTH-021]
name = Brute Force — Kerberos Pre-Auth Brute Force
description = Detects Kerberos pre-authentication brute force attacks through high volume AS-REQ failures
severity = critical
search = index=* sourcetype=auth_logs (EventCode=4768 OR kerberos_event=AS-REQ) status=FAILURE | bucket _time span=5m | stats count as failures by src_ip _time | where failures > 20
sourcetype = auth_logs,windows_security
action = email
references = WSTG04-009,AUTH-021
mitre = T1110.001
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-022]
name = Credential Stuffing — OAuth Token Stuffing
description = Detects attempts to use stolen OAuth tokens across multiple services or applications
severity = high
search = index=* sourcetype=auth_logs action=oauth_token_validation failure | bucket _time span=15m | stats count as failures, dc(client_id) as client_count by src_ip _time | where failures > 10
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-022
mitre = T1110.004,T1528
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 70

[SPL-AUTH-023]
name = Credential Stuffing — Session Token Reuse Across IPs
description = Detects session tokens being used from multiple geographic locations indicating credential theft
severity = critical
search = index=* sourcetype=access_logs action=session_access | stats dc(src_ip) as ip_count, values(src_ip) as src_ips by session_id | where ip_count > 3
sourcetype = access_logs,auth_logs
action = email
references = WSTG04-009,AUTH-023
mitre = T1187,T1539
compliance = PCI-DSS-8.5,NIST-AC-3
risk_score = 90

[SPL-AUTH-024]
name = Credential Stuffing — API Key Rotation Anomaly
description = Detects unusual API key rotation patterns indicating potential compromise and credential replacement
severity = high
search = index=* sourcetype=auth_logs action=api_key_rotation | bucket _time span=1h | stats count as rotations by user _time | where rotations > 5
sourcetype = auth_logs,api_logs
action = email
references = WSTG04-009,AUTH-024
mitre = T1078
compliance = PCI-DSS-8.5,NIST-IA-5
risk_score = 70

[SPL-AUTH-025]
name = MFA Bypass — Bypass Code Abuse
description = Detects excessive use of MFA bypass or recovery codes indicating potential MFA bypass attempts
severity = critical
search = index=* sourcetype=auth_logs action=mfa_bypass_code_used | bucket _time span=1h | stats count as bypass_count by user src_ip _time | where bypass_count > 3
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-025
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-026]
name = MFA Bypass — Enrollment From Unrecognized Device
description = Detects MFA enrollment from a device not previously associated with the user account
severity = high
search = index=* sourcetype=auth_logs action=mfa_enrollment | lookup known_devices user OUTPUT device_id | where isnull(device_id) OR device_id!=mfa_device_id | stats count by user src_ip mfa_device_id
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-026
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 70

[SPL-AUTH-027]
name = MFA Bypass — Expired MFA Token Acceptance
description = Detects authentication accepted with expired or stale MFA tokens indicating time-window bypass
severity = critical
search = index=* sourcetype=auth_logs action=mfa_verify success | eval token_age=_time - mfa_token_issued | where token_age > 300 | stats count by user src_ip token_age
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-027
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-028]
name = MFA Bypass — Secondary Channel Manipulation
description = Detects MFA verification through secondary channels after primary channel failures indicating fallback abuse
severity = high
search = index=* sourcetype=auth_logs action=mfa_challenge | eval channel_priority=case(mfa_method="app",1,mfa_method="sms",2,mfa_method="email",3,mfa_method="backup_code",4) | sort 0 _time | streamstats last(channel_priority) as prev_channel by user | where channel_priority > prev_channel AND prev_channel > 0
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-028
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 70

[SPL-AUTH-029]
name = Account Lockout — Distributed Lockout Campaign
description = Detects distributed account lockout campaigns targeting multiple accounts from multiple sources
severity = critical
search = index=* sourcetype=auth_logs action=account_lockout | bucket _time span=1h | stats dc(user) as locked_users, dc(src_ip) as source_ips by _time | where locked_users > 100 AND source_ips > 10
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-029
mitre = T1110.003,T1498
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 90

[SPL-AUTH-030]
name = Account Lockout — Unlock Immediately After Lockout
description = Detects accounts being unlocked immediately after lockout indicating automated lockout-response cycle abuse
severity = high
search = index=* sourcetype=auth_logs (action=account_lockout OR action=account_unlock) | sort 0 _time | streamstats last(action) as prev_action last(_time) as prev_time by user | where action="account_unlock" AND prev_action="account_lockout" AND (_time - prev_time) < 60
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-030
mitre = T1078
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 70

[SPL-AUTH-031]
name = Authentication — Impossible Travel Login
description = Detects successful logins from geographically impossible locations within a short timeframe
severity = critical
search = index=* sourcetype=auth_logs action=authentication success | iplocation src_ip | sort 0 _time | streamstats last(lat) as prev_lat last(lon) as prev_lon last(_time) as prev_time by user | eval distance_km=6371*acos(cos(radians(lat))*cos(radians(prev_lat))*cos(radians(lon-prev_lon))+sin(radians(lat))*sin(radians(prev_lat))) | eval speed_kmh=distance_km/((_time-prev_time)/3600) | where speed_kmh > 800
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-031
mitre = T1078,T1187
compliance = PCI-DSS-8.5,NIST-IA-2
risk_score = 90

[SPL-AUTH-032]
name = Authentication — Login From Tor Exit Node
description = Detects authentication attempts originating from known Tor exit nodes
severity = high
search = index=* sourcetype=auth_logs action=authentication | lookup tor_exit_nodes src_ip OUTPUT is_tor | where is_tor=1 | stats count by user src_ip action
sourcetype = auth_logs,access_logs,threat_intel
action = email
references = WSTG04-009,AUTH-032
mitre = T1090.003
compliance = PCI-DSS-1.3,NIST-AC-17
risk_score = 70

[SPL-AUTH-033]
name = Authentication — Login From Known Malicious IP
description = Detects authentication attempts from IP addresses on threat intelligence feeds
severity = critical
search = index=* sourcetype=auth_logs action=authentication | lookup threat_intel_feeds src_ip OUTPUT threat_type | where isnotnull(threat_type) | stats count by user src_ip threat_type action
sourcetype = auth_logs,access_logs,threat_intel
action = email
references = WSTG04-009,AUTH-033
mitre = T1078,T1190
compliance = PCI-DSS-1.3,NIST-AC-17
risk_score = 90

[SPL-AUTH-034]
name = Authentication — First-Time Device Login for Privileged Account
description = Detects privileged account logins from devices not previously associated with the account
severity = high
search = index=* sourcetype=auth_logs action=authentication success user_role IN (admin,superuser,privileged) | lookup known_devices user device_fingerprint OUTPUT known | where known=0 OR isnull(known) | stats count by user src_ip device_fingerprint
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-034
mitre = T1078
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 70

[SPL-AUTH-035]
name = Authentication — Off-Hours Privileged Login
description = Detects privileged account logins outside of normal business hours indicating potential compromise
severity = high
search = index=* sourcetype=auth_logs action=authentication success user_role IN (admin,superuser,privileged) | eval hour=strftime(_time,"%H") | where hour < 6 OR hour > 22 | stats count by user src_ip hour
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-035
mitre = T1078
compliance = PCI-DSS-8.5,NIST-AC-6
risk_score = 70

[SPL-AUTH-036]
name = Authentication — Failed Login Followed by Success From Different IP
description = Detects credential compromise where failed logins from one IP are followed by successful login from another IP
severity = critical
search = index=* sourcetype=auth_logs action=authentication | eval outcome=if(action="success","success","failure") | sort 0 _time | streamstats last(outcome) as prev_outcome last(src_ip) as prev_ip by user | where outcome="success" AND prev_outcome="failure" AND src_ip!=prev_ip
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-036
mitre = T1078,T1187
compliance = PCI-DSS-8.5,NIST-AC-3
risk_score = 90

[SPL-AUTH-037]
name = Brute Force — HTTP Basic Auth Brute Force
description = Detects brute force attacks against HTTP Basic Authentication endpoints
severity = high
search = index=* sourcetype=access_logs status=401 auth_type="Basic" | bucket _time span=5m | stats count as failures by src_ip dest_ip _time | where failures > 20
sourcetype = access_logs,web_logs
action = email
references = WSTG04-009,AUTH-037
mitre = T1110.001
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 70

[SPL-AUTH-038]
name = Brute Force — NTLM Relay Attack Detection
description = Detects NTLM relay attacks through authentication proxy patterns and unusual NTLM challenge-response flows
severity = critical
search = index=* sourcetype=auth_logs auth_type="NTLM" | where match(user_agent,"(relay|proxy)") OR src_port IN (445,139) | stats count by src_ip dest_ip user_agent
sourcetype = auth_logs,windows_security,firewall
action = email
references = WSTG04-009,AUTH-038
mitre = T1557.001
compliance = PCI-DSS-8.5,NIST-AC-3
risk_score = 90

[SPL-AUTH-039]
name = Credential Stuffing — SAML Token Forgery
description = Detects potential SAML token forgery through anomalous assertion signatures or replayed assertion IDs
severity = critical
search = index=* sourcetype=auth_logs auth_type="SAML" | dedup assertion_id | stats count by assertion_id | where count > 1 OR isnull(signature_valid) OR signature_valid=0
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-039
mitre = T1606.002
compliance = PCI-DSS-8.3,NIST-IA-9
risk_score = 90

[SPL-AUTH-040]
name = Credential Stuffing — OAuth Authorization Code Theft
description = Detects OAuth authorization code theft through PKCE bypass or code interception
severity = critical
search = index=* sourcetype=auth_logs action=oauth_token_exchange | where (isnull(pkce_verifier) OR pkce_valid=0) AND token_type="authorization_code" | stats count by src_ip client_id
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-040
mitre = T1528
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-041]
name = MFA Bypass — Time-Based OTP Prediction
description = Detects authentication patterns suggesting TOTP seed compromise through predictive OTP timing
severity = critical
search = index=* sourcetype=auth_logs action=mfa_verify auth_type="TOTP" | eval otp_offset=_time % 30 | stats count by user otp_offset | where otp_offset < 2 AND count > 10
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-041
mitre = T1111
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 90

[SPL-AUTH-042]
name = MFA Bypass — MFA Reset via Social Engineering
description = Detects MFA reset requests that bypass normal verification procedures indicating social engineering
severity = high
search = index=* sourcetype=auth_logs action=mfa_reset | where verification_level="low" OR isnull(verification_level) | stats count by user src_ip agent_id
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-042
mitre = T1111,T1598
compliance = PCI-DSS-8.3,NIST-IA-2
risk_score = 70

[SPL-AUTH-043]
name = Account Lockout — Persistent Re-Lockout After Unlock
description = Detects accounts repeatedly locked and unlocked in a short timeframe indicating automated lockout abuse
severity = high
search = index=* sourcetype=auth_logs (action=account_lockout OR action=account_unlock) | bucket _time span=1h | stats count(eval(action="account_lockout")) as lockouts, count(eval(action="account_unlock")) as unlocks by user | where lockouts > 5 AND unlocks > 3
sourcetype = auth_logs,access_logs
action = email
references = WSTG04-009,AUTH-043
mitre = T1110.003
compliance = PCI-DSS-8.5,NIST-AC-7
risk_score = 70

[SPL-AUTH-044]
name = Authentication — Password Spray Attack Detection
description = Detects password spray attacks where a single password is tried against many accounts
severity = critical
search = index=* sourcetype=auth_logs action=authentication failure | eval normalized_password=lower(password_attempt) | bucket _time span=30m | stats dc(user) as unique_users, count as attempts by src_ip normalized_password _time | where unique_users > 15 AND attempts > 15
sourcetype = auth_logs,access_logs
