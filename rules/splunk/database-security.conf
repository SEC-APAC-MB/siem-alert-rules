# =============================================================================
# Splunk SIEM Alert Rules — database-security
# =============================================================================

[SPL-DB-PG-001]
name = PostgreSQL — Privilege Escalation via SET ROLE
description = Detects PostgreSQL SET ROLE attempts for privilege escalation
severity = critical
search = index=* ("postgresql" OR "privilege-escalation" OR "sql") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = DB-PG-001
mitre = T1548
compliance = PCI-DSS-8.5
risk_score = 90

