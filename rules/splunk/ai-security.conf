# =============================================================================
# Splunk SIEM Alert Rules — ai-security
# =============================================================================

[SPL-AI-PI-001]
name = AI — Direct Prompt Injection
description = Detects direct prompt injection attempts overriding system instructions via user input
severity = critical
search = index=* ("prompt-injection" OR "direct" OR "llm") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = AI-PI-001
mitre = T1190
compliance = AI-PI-001,AI-ACT-15
risk_score = 90

