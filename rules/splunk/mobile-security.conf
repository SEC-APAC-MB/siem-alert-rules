# =============================================================================
# Splunk SIEM Alert Rules — mobile-security
# =============================================================================

[SPL-MOB-001]
name = Mobile — Insecure Data Storage on Device
description = Detects mobile app data storage issues including unencrypted SQLite databases and shared preferences
severity = high
search = index=* ("data-storage" OR "masvs" OR "encryption") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = MOB-001
mitre = T1552.001
compliance = MASVS-L2-2.1,GDPR-32A
risk_score = 70

[SPL-MOB-002]
name = Mobile — Insecure Network Communication
description = Detects mobile apps communicating over HTTP, using weak TLS, or accepting self-signed certificates
severity = high
search = index=* ("network" OR "masvs" OR "encryption") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = MOB-002
mitre = T1041
compliance = MASVS-L2-3.1,PCI-DSS-4.1
risk_score = 70

[SPL-MOB-003]
name = Mobile — Hardcoded Credentials in Binary
