# =============================================================================
# Splunk SIEM Alert Rules — wstg-10-business-logic
# =============================================================================

[SPL-WSTG10-001]
name = Business Logic — Price Manipulation
description = Detects price manipulation attempts via negative quantities, zero-price items, or modified totals in checkout
severity = critical
search = index=* ("business-logic" OR "price-manipulation" OR "fraud") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = WSTG10-001
mitre = T1498
compliance = PCI-DSS-6.5
risk_score = 90

