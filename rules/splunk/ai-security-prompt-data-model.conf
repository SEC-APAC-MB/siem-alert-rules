[SPL-AIPDM-033]
name = AI Prompt — Jailbreak via Persona Switching
description = Detects rapid persona switching in conversations that attempts to find a jailbreak path through different characters
severity = medium
search = index=* sourcetype=llm_gateway | transaction user_id session_id maxspan=30m | eval persona_switches=mvcount(match(prompt, "(?i)(you.{0,10}are|act.{0,10}as|pretend.{0,10}to.{0,10}be|roleplay.{0,10}as|respond.{0,10}as).{0,30}(hacker|criminal|expert|dev|admin|unfiltered)")) | where persona_switches > 3
sourcetype = llm_gateway,access_logs
action = log
references = AIPDM-033
mitre = T1190
compliance = AI-PI-017
risk_score = 50

