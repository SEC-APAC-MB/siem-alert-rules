[SPL-AIPDM-035]
name = AI Data Exfil — SSRF via LLM Tool Use
description = Detects LLM-generated tool calls targeting internal URLs, localhost, or cloud metadata endpoints
severity = critical
search = index=* sourcetype=llm_gateway | where match(function_call, "(?i)(http://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|169\\.254\\.169\\.254|metadata\\.google|metadata\\.azure)|http://(10\\.|172\\.(1[6-9]|2[0-9]|3[01])|192\\.168))") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIPDM-035
