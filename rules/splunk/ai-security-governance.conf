[SPL-AIGOV-004]
name = AI Governance — Prohibited AI System Deployment
description = Detects deployment of AI systems prohibited under EU AI Act Article 5 including social scoring and manipulative systems
severity = critical
search = index=* sourcetype=ai_governance action=system_deployment | where match(system_type, "(?i)(social.{0,10}scoring|subliminal.{0,10}manipulation|exploit.{0,10}vulnerability|emotion.{0,10}recognition.{0,10}(child|minor|student)|biometric.{0,10}identification.{0,10}(real.{0,10}time)?)") | stats count, values(system_id) as systems, values(system_type) as types by rule_id
sourcetype = ai_governance,compliance_logs
action = email
references = AIGOV-004
mitre = N/A
compliance = AI-ACT-5,AI-01-005
risk_score = 90

[SPL-AIGOV-005]
name = AI Governance — Bias Detection — Gender Disparities in Outputs
description = Detects statistically significant gender bias patterns in AI model outputs across decision categories
severity = high
search = index=* sourcetype=ai_governance action=model_output | eval gender_mentioned=if(match(output, "(?i)(\\bhe\\b|\\bhis\\b|\\bhim\\b|\\bman\\b|\\bmale\\b|\\bwoman\\b|\\bfemale\\b|\\bshe\\b|\\bher\\b|\\bhers\\b)"), 1, 0) | bucket _time span=1d | stats count, sum(gender_mentioned) as gender_count, count(eval(match(output, "(?i)(\\bhe\\b|\\bhis\\b|\\bhim\\b|\\bman\\b|\\bmale\\b)"))) as male_count, count(eval(match(output, "(?i)(\\bwoman\\b|\\bfemale\\b|\\bshe\\b|\\bher\\b|\\bhers\\b)"))) as female_count by model_id _time | eval male_ratio=male_count/count | where male_ratio > 0.8 OR male_ratio < 0.2
sourcetype = ai_governance,model_logs
action = email
references = AIGOV-005
mitre = N/A
compliance = AI-BIA-001,AI-ACT-9,AI-ACT-10
risk_score = 70

[SPL-AIGOV-006]
name = AI Governance — Bias Detection — Racial/Ethnic Disparities in Decisions
description = Detects racial or ethnic bias in AI decision outputs across protected categories
severity = high
search = index=* sourcetype=ai_governance action=model_decision | lookup demographic_data user_id OUTPUT race_ethnicity | stats count, avg(decision_score) as avg_score by model_id race_ethnicity decision_type | eventstats avg(avg_score) as overall_avg by model_id decision_type | eval disparity=abs(avg_score-overall_avg)/overall_avg | where disparity > 0.15
sourcetype = ai_governance,model_logs,demographic_data
action = email
references = AIGOV-006
mitre = N/A
compliance = AI-BIA-002,AI-ACT-10,GDPR-22-001
risk_score = 70

[SPL-AIGOV-007]
name = AI Governance — Bias Detection — Age-Based Discrimination
