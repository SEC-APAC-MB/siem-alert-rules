[SPL-AIGOV-014]
name = AI Governance — Model Drift Detection
description = Detects significant model performance drift indicating degraded AI system accuracy
severity = high
search = index=* sourcetype=ai_governance action=model_evaluation | lookup ai_model_baselines model_id OUTPUT baseline_accuracy baseline_precision baseline_recall | eval accuracy_drift=abs(accuracy-baseline_accuracy)/baseline_accuracy, precision_drift=abs(precision-baseline_precision)/baseline_precision, recall_drift=abs(recall-baseline_recall)/baseline_recall | where accuracy_drift > 0.1 OR precision_drift > 0.1 OR recall_drift > 0.1
sourcetype = ai_governance,model_logs
