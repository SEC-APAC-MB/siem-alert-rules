# =============================================================================
# Splunk SIEM Alert Rules — ai-security-governance
# AI governance violations, bias detection, policy enforcement, and compliance
# =============================================================================

[SPL-AIGOV-001]
name = AI Governance — Missing Risk Assessment for High-Risk System
description = Detects high-risk AI system operations without required risk assessment documentation per EU AI Act Article 9
severity = critical
search = index=* sourcetype=ai_governance action=system_operation risk_level IN ("high","critical") | lookup ai_risk_assessments system_id OUTPUT assessment_status | where isnull(assessment_status) OR assessment_status!="approved" | stats count, values(system_id) as systems by rule_id
sourcetype = ai_governance,compliance_logs
action = email
references = AIGOV-001
mitre = N/A
compliance = AI-ACT-9,AI-01-009
risk_score = 90

[SPL-AIGOV-002]
name = AI Governance — High-Risk System Without Human Oversight
