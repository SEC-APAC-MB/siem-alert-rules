search = index=* sourcetype=ai_governance action=model_decision | lookup demographic_data user_id OUTPUT age_group | stats count, avg(decision_score) as avg_score, avg(confidence) as avg_confidence by model_id age_group decision_type | eventstats avg(avg_score) as overall_avg by model_id decision_type | eval disparity=abs(avg_score-overall_avg)/overall_avg | where disparity > 0.15
