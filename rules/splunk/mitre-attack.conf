# =============================================================================
# Splunk SIEM Alert Rules — mitre-attack
# =============================================================================

[SPL-MITRE-T1190]
name = Exploit Public-Facing Application
description = Detects exploitation of public-facing web applications, APIs, and services
severity = critical
search = index=* ("initial-access" OR "exploit" OR "web-application") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = MITRE-T1190
mitre = T1190
compliance = PCI-DSS-6.5,NIST-SI-10
risk_score = 90

