# =============================================================================
# Splunk SIEM Alert Rules — ai-security-database-rag-redteam
# AI database attacks, RAG poisoning, and red team detection
# =============================================================================

[SPL-AIDBR-001]
name = AI RAG — Knowledge Base Document Injection
description = Detects injection of malicious content into RAG knowledge bases that corrupts retrieval output
severity = critical
search = index=* sourcetype=rag_gateway action=document_upsert OR action=document_update | where match(document_content, "(?i)(ignore.{0,20}(previous|above|system)|forget.{0,20}(previous|above|system)|disregard.{0,20}(previous|above|system)|override.{0,20}(system|safety))") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-001
mitre = T1190
compliance = AI-RAG-001,AI-ACT-15
risk_score = 90

[SPL-AIDBR-002]
name = AI RAG — Adversarial Document in Retrieval Results
description = Detects adversarial documents surfaced during RAG retrieval that contain embedded injection instructions
severity = high
search = index=* sourcetype=rag_gateway action=retrieval | where match(retrieved_content, "(?i)(ignore.{0,20}(previous|above|system)|forget.{0,20}(previous|above|system)|disregard.{0,20}(previous|above|system)|system.{0,10}instruction.{0,10}(is|are).{0,10}(now|updated|changed))") | stats count, values(user_id) as users by rule_id
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-002
mitre = T1190
compliance = AI-RAG-002,AI-ACT-15
risk_score = 70

[SPL-AIDBR-003]
name = AI RAG — Vector Embedding Similarity Manipulation
description = Detects anomalous embedding similarity scores suggesting adversarial embedding vectors injected into the vector store
severity = high
search = index=* sourcetype=rag_gateway action=retrieval | eval similarity_anomaly=if(similarity_score > 0.98 OR (similarity_score > 0.95 AND match(retrieved_content, "(?i)(hack|exploit|bypass|ignore|forget)")), 1, 0) | bucket _time span=1h | stats sum(similarity_anomaly) as anomaly_count, count as total by collection_name _time | where anomaly_count > 5
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-003
mitre = T1190
compliance = AI-RAG-003
risk_score = 70

[SPL-AIDBR-004]
name = AI RAG — Cross-Tenant Data Leakage via Retrieval
description = Detects RAG retrieval returning documents from other tenants in multi-tenant vector databases
severity = critical
search = index=* sourcetype=rag_gateway action=retrieval | where retrieved_tenant_id!=query_tenant_id | stats count, values(retrieved_tenant_id) as leaked_tenants, dc(retrieved_tenant_id) as leaked_tenant_count by query_tenant_id user_id | where leaked_tenant_count > 0
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-004
mitre = T1078
compliance = GDPR-25-003,AI-RAG-004
risk_score = 90

[SPL-AIDBR-005]
name = AI RAG — Retrieval Scope Manipulation
description = Detects attempts to manipulate RAG retrieval scope to access restricted document collections
severity = high
search = index=* sourcetype=rag_gateway action=retrieval | where match(query, "(?i)(all.{0,10}(collection|document|data)|entire.{0,10}(database|knowledge|corpus)|unrestricted.{0,10}(access|search|query))") OR requested_collections NOT IN (authorized_collections) | stats count, values(user_id) as users by rule_id
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-005
mitre = T1078
compliance = AI-RAG-005,AI-ACT-15
risk_score = 70

[SPL-AIDBR-006]
name = AI RAG — Document Metadata Poisoning
description = Detects manipulation of document metadata (tags, categories, permissions) in RAG knowledge bases to alter retrieval behavior
severity = high
search = index=* sourcetype=rag_gateway action=metadata_update | where match(metadata, "(?i)(admin|root|system|override|elevated|unrestricted)") OR permission_level != previous_permission_level | stats count, values(user_id) as users, values(document_id) as documents by rule_id
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-006
mitre = T1548
compliance = AI-RAG-006
risk_score = 70

[SPL-AIDBR-007]
name = AI RAG — Excessive Retrieval Volume Anomaly
description = Detects anomalous retrieval volumes suggesting data exfiltration through RAG queries
severity = high
search = index=* sourcetype=rag_gateway action=retrieval | bucket _time span=1h | stats count as retrieval_count, sum(retrieved_tokens) as total_tokens by user_id _time | where retrieval_count > 500 OR total_tokens > 100000
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-007
mitre = T1213
compliance = AI-RAG-007,GDPR-25-008
risk_score = 70

[SPL-AIDBR-008]
name = AI Database — SQL Injection via LLM-Generated Queries
description = Detects SQL injection in queries generated by LLM text-to-SQL pipelines
severity = critical
search = index=* sourcetype=llm_gateway action=sql_generation | where match(generated_sql, "(?i)(UNION.{0,30}SELECT|OR.{0,10}1.{0,5}=.{0,5}1|;.{0,5}(DROP|DELETE|UPDATE|INSERT|ALTER|CREATE)|--.{0,5}|/\\*.{0,50}\\*/|WAITFOR.{0,20}DELAY|BENCHMARK.{0,20}\\(|SLEEP.{0,20}\\(|pg_sleep|xp_cmdshell|INTO.{0,20}OUTFILE)") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = llm_gateway,access_logs,database_logs
action = email
references = AIDBR-008
mitre = T1190
compliance = PCI-DSS-6.5,AI-ACT-15
risk_score = 90

[SPL-AIDBR-009]
name = AI Database — Unauthorized Data Access via Text-to-SQL
description = Detects LLM-generated SQL queries accessing tables or columns the user should not have access to
severity = critical
search = index=* sourcetype=llm_gateway action=sql_generation | where match(generated_sql, "(?i)(SELECT.{0,100}(password|secret|credit_card|ssn|salary|compensation|salary|private_key|api_key).{0,100}FROM|FROM.{0,100}(admin|internal|restricted|confidential|secret|hr_|payroll))") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = llm_gateway,access_logs,database_logs
action = email
references = AIDBR-009
mitre = T1078
compliance = PCI-DSS-8.5,GDPR-25-003,AI-ACT-15
risk_score = 90

[SPL-AIDBR-010]
name = AI Database — Prompt Injection via Natural Language Query
description = Detects natural language queries to text-to-SQL systems that contain prompt injection instructions
severity = critical
search = index=* sourcetype=llm_gateway action=sql_generation | where match(user_query, "(?i)(ignore.{0,20}(previous|above|system|sql|schema)|forget.{0,20}(previous|above|system|sql|schema)|show.{0,20}all.{0,20}(table|column|data)|bypass.{0,20}(security|access|permission|rls)|output.{0,20}(raw|unfiltered|complete).{0,20}(sql|query))") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-010
mitre = T1190
compliance = AI-RAG-008,AI-ACT-15
risk_score = 90

[SPL-AIDBR-011]
name = AI Database — Data Exfiltration via SQL Result Set
description = Detects LLM-generated SQL queries returning excessive data or PII fields indicating data exfiltration
severity = critical
search = index=* sourcetype=llm_gateway action=sql_generation | eval result_size=len(sql_result) | where result_size > 100000 OR match(generated_sql, "(?i)(SELECT.{0,5}\\*|SELECT.{0,100}(password|ssn|credit_card|api_key|private_key|secret|token))") | stats count, values(user_id) as users by rule_id
sourcetype = llm_gateway,access_logs,database_logs
action = email
references = AIDBR-011
mitre = T1213
compliance = GDPR-25-008,PCI-DSS-3.4,AI-ACT-15
risk_score = 90

[SPL-AIDBR-012]
name = AI Database — Schema Enumeration via LLM
description = Detects attempts to enumerate database schema through LLM natural language queries
severity = high
search = index=* sourcetype=llm_gateway action=sql_generation | where match(user_query, "(?i)(list.{0,20}(all|every).{0,20}(table|column|schema|view)|show.{0,20}(all|every).{0,20}(table|column|schema|view)|describe.{0,20}(database|schema|table)|what.{0,20}(table|column|schema).{0,20}(exist|are there|do you have))") | bucket _time span=1h | stats count by user_id src_ip | where count > 10
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-012
mitre = T1083
compliance = PCI-DSS-1.3,AI-ACT-15
risk_score = 70

[SPL-AIDBR-013]
name = AI Database — Row-Level Security Bypass via LLM
description = Detects LLM-generated SQL queries that attempt to bypass row-level security policies
severity = critical
search = index=* sourcetype=llm_gateway action=sql_generation | where match(generated_sql, "(?i)(SET.{0,10}ROLE|SET.{0,10}CURRENT_ROLE|BYPASS.{0,10}RLS|DISABLE.{0,10}RLS|ROW.{0,10}LEVEL.{0,10}SECURITY.{0,10}(DISABLE|OFF|BYPASS)|SESSION.{0,10}AUTHORIZATION|SET.{0,10}SESSION.{0,10}AUTHORIZATION)") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = llm_gateway,access_logs,database_logs
action = email
