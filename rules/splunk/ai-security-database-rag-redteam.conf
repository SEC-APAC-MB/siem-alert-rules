risk_score = 90

[SPL-AIDBR-014]
name = AI Red Team — Adversarial Prompt Testing Detection
description = Detects adversarial prompt testing patterns that simulate red team attacks against LLM safety measures
severity = high
search = index=* sourcetype=llm_gateway | where match(prompt, "(?i)(hack|exploit|attack|bypass|circumvent|evade|subvert|break.{0,10}(security|safety|filter|guard|protect)|find.{0,20}(vulnerability|weakness|flaw)|test.{0,20}(security|safety|boundary|limit))") AND match(prompt, "(?i)(LLM|AI|model|GPT|Claude|Gemini|chatbot|assistant)") | bucket _time span=1h | stats count, values(user_id) as users by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-014
mitre = T1190
compliance = AI-RED-001,AI-ACT-15
risk_score = 70

[SPL-AIDBR-015]
name = AI Red Team — Prompt Fuzzing Attack
description = Detects systematic prompt variations indicating automated fuzzing or testing of LLM guardrails
severity = high
search = index=* sourcetype=llm_gateway | eval prompt_prefix=substr(prompt, 1, 50) | bucket _time span=1h | stats dc(prompt) as unique_prompts, count as total_requests by user_id src_ip _time | where unique_prompts > 50 AND unique_prompts/total_requests > 0.8
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-015
mitre = T1190
compliance = AI-RED-002,AI-ACT-15
risk_score = 70

[SPL-AIDBR-016]
name = AI Red Team — Automated Jailbreak Testing
description = Detects automated jailbreak testing frameworks sending systematic attack patterns
severity = critical
search = index=* sourcetype=llm_gateway | bucket _time span=5m | stats count as requests, dc(prompt) as unique_prompts by user_id src_ip _time | where requests > 20 AND unique_prompts > 15 | eventstats avg(requests) as avg_rate by user_id | where requests > avg_rate * 5
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-016
mitre = T1190
compliance = AI-RED-003,AI-ACT-15
risk_score = 90

[SPL-AIDBR-017]
name = AI Red Team — Model Boundary Testing
description = Detects systematic testing of LLM content policy boundaries through progressive escalation
severity = high
search = index=* sourcetype=llm_gateway | transaction user_id session_id maxspan=30m | eval escalation=if(match(prompt, "(?i)(can.{0,10}you|will.{0,10}you|how.{0,10}to|what.{0,10}happens.{0,10}if|what.{0,10}would.{0,10}you.{0,10}do)"), 1, 0) | where escalation > 0 AND match(prompt, "(?i)(weapon|bomb|drug|hack|exploit|kill|harm|illegal)") | stats count by user_id session_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-017
mitre = T1190
compliance = AI-RED-004
risk_score = 70

[SPL-AIDBR-018]
name = AI Red Team — Harmful Content Generation Bypass
description = Detects successful bypasses of content safety filters resulting in harmful content generation
severity = critical
search = index=* sourcetype=llm_gateway | where safety_flag=1 AND response_action="allow" OR match(response, "(?i)(step.{0,10}by.{0,10}step.{0,30}(hack|exploit|attack|bomb|weapon|drug)|here.{0,20}(is|are).{0,20}(the|a).{0,20}(hack|exploit|bomb|weapon|drug).{0,20}(recipe|formula|instruction|guide)|I.{0,20}(can|will).{0,20}(help|provide|give|show|tell).{0,20}you.{0,20}(how|what|where))") | stats count, values(user_id) as users by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-018
mitre = T1190
compliance = AI-SAF-001,AI-ACT-15
risk_score = 90

[SPL-AIDBR-019]
name = AI RAG — Semantic Search Manipulation
description = Detects adversarial queries designed to manipulate semantic search results in RAG systems
severity = high
search = index=* sourcetype=rag_gateway action=retrieval | where match(query, "(?i)(irrelevant.{0,20}(result|document|answer)|boost.{0,20}(rank|score|priority)|demote.{0,20}(rank|score|priority)|manipulate.{0,20}(search|retrieval|ranking))") OR (retrieval_score < 0.3 AND match(query, "(?i)(hack|exploit|attack|bypass)")) | stats count, values(user_id) as users by rule_id
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-019
mitre = T1190
compliance = AI-RAG-009
risk_score = 70

[SPL-AIDBR-020]
name = AI RAG — Context Window Poisoning
description = Detects attempts to poison the LLM context window by injecting content through retrieved documents
severity = critical
search = index=* sourcetype=rag_gateway action=retrieval | eval total_context_tokens=sum(retrieved_tokens) | where total_context_tokens > 8000 AND match(retrieved_content, "(?i)(ignore|forget|disregard|override|system.{0,10}prompt|instruction)") | stats count, values(user_id) as users by rule_id
sourcetype = rag_gateway,access_logs
action = email
