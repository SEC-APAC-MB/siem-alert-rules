description = Detects injection attacks against vector database query filters and search parameters
severity = high
search = index=* sourcetype=rag_gateway OR sourcetype=vector_db | where match(query_filter, "(?i)(\\$where|\\$regex|\\$gt|\\$lt|\\$ne|\\$or|\\$and|\\$not|\\$exists|script|eval|function|__proto__|constructor|prototype)") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
