description = Detects NoSQL injection in queries generated by LLM natural language to NoSQL pipelines
severity = critical
search = index=* sourcetype=llm_gateway action=nosql_generation | where match(generated_query, "(?i)(\\$where|\\$regex|\\$gt|\\$lt|\\$ne|\\$or|\\$and|\\$not|\\$exists|\\$expr|\\$jsonSchema|\\$toString|\\$toInt|\\$split)") AND NOT match(user_query, "(?i)(count|find|search|aggregate)") | stats count, values(user_id) as users by rule_id
