[SPL-AIDBR-035]
name = AI Database — LLM-Generated Code Execution Risk
description = Detects LLM-generated code that attempts file system, network, or system operations
severity = critical
search = index=* sourcetype=llm_gateway action=code_generation | where match(generated_code, "(?i)(import.{0,10}(os|subprocess|sys|socket|http|urllib|requests)|open\\(.{0,50}(w|a)|eval\\(|exec\\(|__import__|os\\.system|subprocess\\.call|subprocess\\.run|os\\.popen|shutil\\.(rmtree|move|copy)|os\\.(remove|rename|makedirs)|socket\\.socket)") | stats count, values(user_id) as users, values(src_ip) as src_ips by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-035
mitre = T1059,T1190
compliance = PCI-DSS-6.5,AI-ACT-15
risk_score = 90

[SPL-AIDBR-036]
name = AI Red Team — Multi-Modal Attack Detection
description = Detects multi-modal attack patterns combining text, images, and other inputs to bypass LLM safety
severity = critical
search = index=* sourcetype=llm_gateway | where input_types IN ("text","image","audio","video") AND match(text_content, "(?i)(ignore|forget|disregard|override|bypass|circumvent)") AND match(ocr_text, "(?i)(system|prompt|instruction|safety|guard|filter)") | stats count, values(user_id) as users by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-036
mitre = T1190
compliance = AI-PI-024,AI-ACT-15
risk_score = 90

[SPL-AIDBR-037]
name = AI Database — Graph Database Injection via LLM
description = Detects Cypher or Gremlin injection in LLM-generated graph database queries
severity = high
search = index=* sourcetype=llm_gateway action=graph_query_generation | where match(generated_query, "(?i)(WITH.{0,30}DELETE|WITH.{0,30}DETACH.{0,30}DELETE|UNWIND.{0,30}(RANGE|COLLECT)|CALL.{0,20}(dbms|apoc).{0,50}(security|auth|execute)|CREATE.{0,30}(CONSTRAINT|INDEX)|DROP.{0,30}(CONSTRAINT|INDEX)|LOAD.{0,30}CSV.{0,50}(FROM|WITH)){0,10}(http|https|ftp|file))") | stats count, values(user_id) as users by rule_id
sourcetype = llm_gateway,access_logs,database_logs
action = email
references = AIDBR-037
mitre = T1190
compliance = PCI-DSS-6.5,AI-ACT-15
risk_score = 70

[SPL-AIDBR-038]
name = AI Red Team — Model Capability Enumeration
description = Detects systematic enumeration of LLM model capabilities, tools, and functions
severity = medium
search = index=* sourcetype=llm_gateway | where match(prompt, "(?i)(what.{0,20}(can|are).{0,20}(your|the).{0,20}(tool|function|capability|ability|limitation|restriction)|list.{0,20}(your|the|all).{0,20}(tool|function|capability|ability|endpoint|api)|which.{0,20}(tool|function|api|endpoint).{0,20}(are|is).{0,20}(available|accessible|enabled|active))") | bucket _time span=1h | stats count by user_id src_ip | where count > 15
sourcetype = llm_gateway,access_logs
action = log
references = AIDBR-038
mitre = T1083
compliance = AI-RED-007
risk_score = 50

[SPL-AIDBR-039]
name = AI Database — Unauthorized API Call via LLM Tool Use
description = Detects LLM tool/function calls targeting unauthorized API endpoints or internal services
severity = critical
search = index=* sourcetype=llm_gateway action=tool_call | where match(function_name, "(?i)(delete_|drop_|admin_|internal_|private_|secret_|config_|system_)") OR match(function_parameters, "(?i)(http://(localhost|127|10\\.|172\\.(1[6-9]|2[0-9]|3[01])|192\\.168)|https://admin|https://internal)") | stats count, values(user_id) as users, values(function_name) as functions by rule_id
sourcetype = llm_gateway,access_logs
action = email
references = AIDBR-039
mitre = T1190
compliance = AI-PI-025,AI-ACT-15
risk_score = 90

[SPL-AIDBR-040]
name = AI RAG — Knowledge Base Integrity Verification Failure
description = Detects RAG knowledge base integrity check failures indicating potential data tampering
severity = critical
search = index=* sourcetype=rag_gateway action=integrity_check | where integrity_status="failed" OR hash_mismatch=1 | stats count, values(document_id) as affected_documents by collection_name rule_id
sourcetype = rag_gateway,access_logs
action = email
references = AIDBR-040
mitre = T1565
compliance = AI-RAG-016,AI-ACT-15
risk_score = 90