# =============================================================================
# Splunk SIEM Alert Rules — compliance-pci-dss
# PCI-DSS specific detection rules for payment card data security
# =============================================================================

[SPL-PCI-001]
name = PCI-DSS 1.1 — Unauthorized Network Traffic in CDE
description = Detects network traffic from unauthorized sources within the Cardholder Data Environment
severity = critical
search = index=* sourcetype=firewall src_zone="cde" OR dest_zone="cde" | lookup authorized_cde_networks src_ip OUTPUT is_authorized | where isnull(is_authorized) OR is_authorized=0 | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id
sourcetype = firewall,network_logs
action = email
references = PCI-001
mitre = T1190
compliance = PCI-DSS-1.1,PCI-DSS-1.3
risk_score = 90

[SPL-PCI-002]
name = PCI-DSS 1.2 — Firewall Rule Modification in CDE
description = Detects unauthorized modifications to firewall rules protecting the Cardholder Data Environment
severity = critical
search = index=* sourcetype=firewall action=rule_change (src_zone="cde" OR dest_zone="cde") | where change_status!="approved" OR isnull(change_status) | stats count, values(rule_id) as rules, values(admin_user) as users by rule_id
sourcetype = firewall,network_logs
action = email
references = PCI-002
mitre = T1562.004
compliance = PCI-DSS-1.2
risk_score = 90

[SPL-PCI-003]
name = PCI-DSS 1.3 — Inbound Traffic from Untrusted to CDE
description = Detects inbound network traffic from untrusted networks to the Cardholder Data Environment
severity = critical
search = index=* sourcetype=firewall action=allow src_zone="untrusted" dest_zone="cde" | where NOT match(dest_port,"^(443|8443)$") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips, values(dest_port) as ports by rule_id
sourcetype = firewall,network_logs
action = email
references = PCI-003
mitre = T1190
compliance = PCI-DSS-1.3
risk_score = 90

[SPL-PCI-004]
name = PCI-DSS 2.1 — Default Credentials on CDE Systems
description = Detects use of default or vendor-supplied credentials on systems within the Cardholder Data Environment
severity = critical
search = index=* sourcetype=auth_logs action=authentication success dest_zone="cde" | lookup default_credentials dest_host user OUTPUT is_default | where is_default=1 | stats count, values(dest_host) as hosts, values(user) as users by rule_id
sourcetype = auth_logs,access_logs
action = email
references = PCI-004
mitre = T1078.001
compliance = PCI-DSS-2.1
risk_score = 90

[SPL-PCI-005]
name = PCI-DSS 2.2 — Unnecessary Services on CDE Systems
description = Detects unnecessary services or protocols running on systems within the Cardholder Data Environment
severity = high
search = index=* sourcetype=system_logs (src_zone="cde" OR dest_zone="cde") | lookup hardened_services dest_host service OUTPUT is_required | where isnull(is_required) OR is_required=0 | stats count, values(dest_host) as hosts, values(service) as services by rule_id
sourcetype = system_logs,network_logs
action = email
references = PCI-005
mitre = T1068
compliance = PCI-DSS-2.2
risk_score = 70

[SPL-PCI-006]
name = PCI-DSS 3.4 — Cardholder Data Stored in Cleartext
description = Detects storage of Primary Account Numbers or cardholder data without encryption
severity = critical
search = index=* sourcetype=file_monitor dest_zone="cde" | where match(file_content, "(?i)(\\b4[0-9]{12}(?:[0-9]{3})?\\b|\\b5[1-5][0-9]{14}\\b|\\b3[47][0-9]{13}\\b|\\b6(?:011|5[0-9]{2})[0-9]{12}\\b)") AND encryption_status="none" | stats count, values(dest_host) as hosts, values(file_path) as files by rule_id
sourcetype = file_monitor,data_logs
action = email
references = PCI-006
mitre = T1552.001
compliance = PCI-DSS-3.4,PCI-DSS-3.5
risk_score = 90

[SPL-PCI-007]
name = PCI-DSS 3.5 — Weak Encryption Key Management
description = Detects use of weak, deprecated, or insufficient encryption key lengths for cardholder data protection
severity = critical
search = index=* sourcetype=system_logs (src_zone="cde" OR dest_zone="cde") | where match(encryption_details, "(?i)(DES|RC4|MD5|SHA1|3DES|SSLv3|TLSv1[^\\.2]|TLS_1_0|key_length.{0,10}(128|56|40)|RSA_1024)") | stats count, values(dest_host) as hosts, values(encryption_details) as weak_crypto by rule_id
sourcetype = system_logs,crypto_logs
action = email
references = PCI-007
mitre = T1573
compliance = PCI-DSS-3.5,PCI-DSS-4.1
risk_score = 90

[SPL-PCI-008]
name = PCI-DSS 4.1 — Weak TLS Version in CDE
description = Detects TLS connections using deprecated versions (SSLv3, TLS 1.0, TLS 1.1) in the Cardholder Data Environment
severity = critical
search = index=* sourcetype=network_logs (src_zone="cde" OR dest_zone="cde") | where tls_version IN ("SSLv3","TLSv1.0","TLSv1.1") OR match(tls_version, "(?i)(SSLv[23]|TLSv1[^\\.])") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips, values(tls_version) as versions by rule_id
sourcetype = network_logs,firewall
action = email
references = PCI-008
mitre = T1573
compliance = PCI-DSS-4.1
risk_score = 90

[SPL-PCI-009]
name = PCI-DSS 5.1 — Malware Not Detected on CDE Systems
description = Detects systems in the Cardholder Data Environment without active malware protection
severity = critical
search = index=* sourcetype=system_logs dest_zone="cde" | lookup antivirus_status dest_host OUTPUT av_status last_scan_date | where isnull(av_status) OR av_status="disabled" OR av_status="outdated" OR (now()-strptime(last_scan_date,"%Y-%m-%d"))/86400 > 7 | stats count, values(dest_host) as hosts by rule_id
sourcetype = system_logs,security_logs
action = email
references = PCI-009
mitre = T1562.001
compliance = PCI-DSS-5.1
risk_score = 90

[SPL-PCI-010]
name = PCI-DSS 5.3 — Antivirus Disabled or Modified in CDE
description = Detects attempts to disable or modify antivirus software on systems in the Cardholder Data Environment
severity = critical
search = index=* sourcetype=system_logs (src_zone="cde" OR dest_zone="cde") | where match(event, "(?i)(antivirus.{0,20}(disabled|stopped|uninstalled|modified)|defender.{0,20}(disabled|stopped|uninstalled|modified)|security.{0,20}(tool|software).{0,20}(disabled|stopped|uninstalled|modified))") | stats count, values(dest_host) as hosts, values(user) as users by rule_id
sourcetype = system_logs,security_logs
action = email
references = PCI-010
mitre = T1562.001
compliance = PCI-DSS-5.3
risk_score = 90

[SPL-PCI-011]
name = PCI-DSS 6.1 — Unpatched Critical Vulnerability in CDE
description = Detects systems in the Cardholder Data Environment with unpatched critical or high-severity vulnerabilities
severity = critical
search = index=* sourcetype=vulnerability_scanner dest_zone="cde" | where severity IN ("critical","high") AND patch_status!="applied" AND age_days > 30 | stats count, values(dest_host) as hosts, values(cve_id) as cves, values(severity) as severities by rule_id
sourcetype = vulnerability_scanner,security_logs
action = email
references = PCI-011
mitre = T1190
compliance = PCI-DSS-6.1,PCI-DSS-6.2
risk_score = 90

[SPL-PCI-012]
name = PCI-DSS 6.3 — Unauthorized Code Changes in CDE
description = Detects code or configuration changes in the Cardholder Data Environment without proper change control
severity = critical
search = index=* sourcetype=change_management dest_zone="cde" | lookup change_approvals change_id OUTPUT approval_status | where isnull(approval_status) OR approval_status NOT IN ("approved","emergency_approved") | stats count, values(change_id) as changes, values(user) as users by rule_id
sourcetype = change_management,system_logs
action = email
references = PCI-012
mitre = T1078
compliance = PCI-DSS-6.3
risk_score = 90

[SPL-PCI-013]
name = PCI-DSS 6.5 — Web Application Attack in CDE
description = Detects web application attacks (SQL injection, XSS, etc.) against systems in the Cardholder Data Environment
severity = critical
search = index=* sourcetype=access_logs dest_zone="cde" | where match(uri_path, "(?i)(UNION.{0,30}SELECT|OR.{0,10}1.{0,5}=[0-9]|<script|javascript:|onerror|onload|eval\\(|SELECT.{0,50}FROM|DROP.{0,20}TABLE|INSERT.{0,50}INTO)") OR attack_category IN ("sql_injection","xss","command_injection","path_traversal") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips, values(attack_category) as categories by rule_id
sourcetype = access_logs,waf_logs
action = email
references = PCI-013
mitre = T1190
compliance = PCI-DSS-6.5
risk_score = 90

[SPL-PCI-014]
name = PCI-DSS 6.6 — Missing WAF or Code Review for CDE Web Apps
description = Detects CDE-facing web applications without WAF protection or recent code review
severity = high
search = index=* sourcetype=asset_inventory asset_type="web_application" dest_zone="cde" | lookup waf_protection dest_host OUTPUT waf_status | lookup code_reviews dest_host OUTPUT last_review_date | where isnull(waf_status) OR waf_status="none" OR isnull(last_review_date) OR (now()-strptime(last_review_date,"%Y-%m-%d"))/86400 > 90 | stats count, values(dest_host) as hosts by rule_id
sourcetype = asset_inventory,compliance_logs
action = email
references = PCI-014
mitre = N/A
compliance = PCI-DSS-6.6
risk_score = 70

[SPL-PCI-015]
name = PCI-DSS 7.1 — Excessive Privileges in CDE
description = Detects users with excessive privileges beyond their job requirements in the Cardholder Data Environment
severity = high
search = index=* sourcetype=access_logs dest_zone="cde" | lookup role_assignments user OUTPUT assigned_roles required_roles | eval excessive_privileges=mvcount(assigned_roles)-mvcount(required_roles) | where excessive_privileges > 0 | stats count, values(user) as users, values(excessive_privileges) as excess_count by rule_id
sourcetype = access_logs,iam_logs
action = email
references = PCI-015
mitre = T1078
compliance = PCI-DSS-7.1,PCI-DSS-7.2
risk_score = 70

[SPL-PCI-016]
name = PCI-DSS 7.2 — Shared Accounts in CDE
description = Detects use of shared or generic accounts in the Cardholder Data Environment
severity = high
search = index=* sourcetype=auth_logs dest_zone="cde" | lookup shared_accounts user OUTPUT is_shared | where is_shared=1 | stats count, values(user) as shared_accounts, values(src_ip) as src_ips by rule_id
sourcetype = auth_logs,access_logs
action = email
references = PCI-016
mitre = T1078.002
compliance = PCI-DSS-7.2,PCI-DSS-8.1
risk_score = 70

[SPL-PCI-017]
name = PCI-DSS 8.1 — Unique ID Assignment Failure in CDE
description = Detects authentication events in CDE without unique user identification
severity = high
search = index=* sourcetype=auth_logs dest_zone="cde" | where isnull(user_id) OR user_id="" OR user_id IN ("admin","root","shared","guest","default","service") | stats count, values(user_id) as user_ids, values(dest_host) as hosts by rule_id
sourcetype = auth_logs,access_logs
action = email
references = PCI-017
mitre = T1078
compliance = PCI-DSS-8.1
risk_score = 70

[SPL-PCI-018]
name = PCI-DSS 8.2 — Weak Password in CDE
description = Detects accounts in the Cardholder Data Environment with passwords not meeting PCI-DSS requirements
severity = high
search = index=* sourcetype=auth_logs dest_zone="cde" action=password_change | lookup password_policy user OUTPUT min_length complexity_expiry | where password_length < 7 OR isnull(complexity_expiry) OR complexity_expiry="failed" | stats count, values(user) as users, values(dest_host) as hosts by rule_id
sourcetype = auth_logs,iam_logs
action = email
references = PCI-018
mitre = T1110
compliance = PCI-DSS-8.2
risk_score = 70

[SPL-PCI-019]
name = PCI-DSS 8.3 — MFA Missing for CDE Access
description = Detects access to the Cardholder Data Environment without required multi-factor authentication
severity = critical
search = index=* sourcetype=auth_logs dest_zone="cde" action=authentication success | where mfa_used=0 OR isnull(mfa_used) | stats count, values(user) as users, values(dest_host) as hosts by rule_id
sourcetype = auth_logs,access_logs
action = email
references = PCI-019
mitre = T1111
compliance = PCI-DSS-8.3,PCI-DSS-8.4
risk_score = 90

[SPL-PCI-020]
name = PCI-DSS 8.5 — Account Lockout Not Enforced in CDE
description = Detects accounts in CDE without proper lockout after failed authentication attempts
severity = high
search = index=* sourcetype=auth_logs dest_zone="cde" action=authentication failure | bucket _time span=15m | stats count as failures by user dest_host _time | where failures > 6 AND lockout_triggered=0 | stats count, values(user) as users, values(dest_host) as hosts by rule_id
sourcetype = auth_logs,access_logs
action = email
references = PCI-020
mitre = T1110
compliance = PCI-DSS-8.5
risk_score = 70

[SPL-PCI-021]
name = PCI-DSS 8.6 — MFA Bypass for CDE Admin Access
description = Detects privileged CDE access that bypassed multi-factor authentication
severity = critical
search = index=* sourcetype=auth_logs dest_zone="cde" action=authentication success user_role IN (admin,superuser,privileged) | where mfa_bypassed=1 OR mfa_used=0 OR isnull(mfa_used) | stats count, values(user) as users, values(dest_host) as hosts by rule_id
sourcetype = auth_logs,access_logs
action = email
references = PCI-021
mitre = T1111
compliance = PCI-DSS-8.6
risk_score = 90

[SPL-PCI-022]
name = PCI-DSS 10.1 — Audit Log Tampering in CDE
description = Detects tampering, deletion, or modification of audit logs in the Cardholder Data Environment
severity = critical
search = index=* sourcetype=system_logs dest_zone="cde" | where match(event, "(?i)(log.{0,20}(deleted|cleared|truncated|modified|tampered)|audit.{0,20}(log|trail).{0,20}(deleted|cleared|modified|disabled)|event.{0,20}log.{0,20}(clear|delete|modify|disable))") | stats count, values(dest_host) as hosts, values(user) as users by rule_id
sourcetype = system_logs,security_logs
action = email
references = PCI-022
mitre = T1562.006,T1070
compliance = PCI-DSS-10.1
risk_score = 90

[SPL-PCI-023]
name = PCI-DSS 10.2 — Privileged Activity in CDE Without Log
description = Detects privileged activity in CDE that was not properly logged per PCI-DSS requirements
severity = critical
search = index=* sourcetype=access_logs dest_zone="cde" user_role IN (admin,superuser,privileged) | lookup audit_log_correlation event_id OUTPUT logged_event | where isnull(logged_event) | stats count, values(user) as users, values(dest_host) as hosts, values(action) as actions by rule_id
sourcetype = access_logs,audit_logs
action = email
references = PCI-023
mitre = T1562
compliance = PCI-DSS-10.2
risk_score = 90

[SPL-PCI-024]
name = PCI-DSS 10.3 — Insufficient Audit Trail Detail in CDE
description = Detects audit logs in CDE missing required fields (user, event, date/time, success/failure, origin)
severity = high
search = index=* sourcetype=audit_logs dest_zone="cde" | eval missing_fields=0 | where isnull(user) OR isnull(event_type) OR isnull(timestamp) OR isnull(outcome) OR isnull(source_ip) | stats count, values(dest_host) as hosts, values(missing_fields) as missing by rule_id
sourcetype = audit_logs,compliance_logs
action = email
references = PCI-024
mitre = N/A
compliance = PCI-DSS-10.3
risk_score = 70

[SPL-PCI-025]
name = PCI-DSS 10.4 — Time Synchronization Failure in CDE
description = Detects time synchronization failures on systems in the Cardholder Data Environment
severity = high
search = index=* sourcetype=system_logs dest_zone="cde" | where match(event, "(?i)(ntp.{0,20}(fail|error|timeout|sync.{0,10}lost)|clock.{0,20}(drift|skew|desync|offset)|time.{0,20}(sync|synchronization).{0,20}(fail|error|lost))") | stats count, values(dest_host) as hosts by rule_id
sourcetype = system_logs,network_logs
action = email
references = PCI-025
mitre = N/A
compliance = PCI-DSS-10.4
risk_score = 70

[SPL-PCI-026]
name = PCI-DSS 10.7 — Audit Log Review Failure in CDE
description = Detects CDE systems where daily audit log review was not performed
severity = medium
search = index=* sourcetype=compliance_logs dest_zone="cde" action=log_review | bucket _time span=1d | stats count as reviews by dest_host _time | where reviews = 0 | stats count, values(dest_host) as hosts by rule_id
sourcetype = compliance_logs,audit_logs
action = log
references = PCI-026
mitre = N/A
compliance = PCI-DSS-10.7
risk_score = 50

[SPL-PCI-027]
name = PCI-DSS 11.1 — Unauthorized Wireless Access Points in CDE
description = Detects unauthorized wireless access points within or near the Cardholder Data Environment
severity = critical
search = index=* sourcetype=wireless_scanner | where (bssid_zone="cde" OR signal_strength > -70) AND authorized=0 | stats count, values(bssid) as unauthorized_bssids, values(ssid) as ssids by rule_id
sourcetype = wireless_scanner,network_logs
action = email
references = PCI-027
mitre = T1146,T1114
compliance = PCI-DSS-11.1
risk_score = 90

[SPL-PCI-028]
name = PCI-DSS 11.2 — Vulnerability Scan Overdue in CDE
description = Detects CDE systems that have not been vulnerability-scanned within the required interval
severity = high
search = index=* sourcetype=asset_inventory dest_zone="cde" | lookup vulnerability_scan_history dest_host OUTPUT last_scan_date | eval days_since_scan=(now()-strptime(last_scan_date,"%Y-%m-%d"))/86400 | where isnull(last_scan_date) OR days_since_scan > 90 | stats count, values(dest_host) as hosts, values(days_since_scan) as days_overdue by rule_id
sourcetype = asset_inventory,vulnerability_scanner
action = email
references = PCI-028
mitre = N/A
compliance = PCI-DSS-11.2,PCI-DSS-11.3
risk_score = 70

[SPL-PCI-029]
name = PCI-DSS 11.3 — Penetration Test Overdue for CDE
description = Detects CDE network segments that have not had penetration testing within the required interval
severity = high
search = index=* sourcetype=compliance_logs dest_zone="cde" action=penetration_test | lookup pen_test_history dest_zone OUTPUT last_test_date | eval days_since_test=(now()-strptime(last_test_date,"%Y-%m-%d"))/86400 | where isnull(last_test_date) OR days_since_test > 365 | stats count, values(dest_zone) as zones by rule_id
sourcetype = compliance_logs
action = email
references = PCI-029
mitre = N/A
compliance = PCI-DSS-11.3
risk_score = 70

[SPL-PCI-030]
name = PCI-DSS 11.5 — File Integrity Change in CDE
description = Detects unauthorized file integrity changes on critical system files in the Cardholder Data Environment
severity = critical
search = index=* sourcetype=fim dest_zone="cde" | where change_type!="approved" OR isnull(change_type) | stats count, values(dest_host) as hosts, values(file_path) as files, values(change_type) as change_types by rule_id
sourcetype = fim,system_logs
action = email
references = PCI-030
mitre = T1070
compliance = PCI-DSS-11.5
risk_score = 90

[SPL-PCI-031]
name = PCI-DSS 12.1 — Security Policy Not Acknowledged by CDE Staff
description = Detects personnel with CDE access who have not acknowledged the information security policy
severity = medium
search = index=* sourcetype=hr_compliance dest_zone="cde" | lookup policy_acknowledgements user OUTPUT acknowledgement_date | where isnull(acknowledgement_date) OR (now()-strptime(acknowledgement_date,"%Y-%m-%d"))/86400 > 365 | stats count, values(user) as users by rule_id
sourcetype = hr_compliance,compliance_logs
action = log
references = PCI-031
mitre = N/A
compliance = PCI-DSS-12.1
risk_score = 50

[SPL-PCI-032]
name = PCI-DSS 12.4 — Service Provider Data Breach Notification
description = Detects potential data breaches at service providers requiring PCI-DSS notification
severity = critical
search = index=* sourcetype=breach_detection dest_zone="cde" | where breach_confirmed=1 OR (compromised_systems > 0 AND pan_potentially_compromised=1) | stats count, values(incident_id) as incidents, values(compromised_systems) as systems by rule_id
sourcetype = breach_detection,incident_logs
action = email
references = PCI-032
mitre = T1190,T1078
compliance = PCI-DSS-12.4,PCI-DSS-12.10
risk_score = 90

[SPL-PCI-033]
name = PCI-DSS 3.3 — PAN Displayed in Cleartext
description = Detects Primary Account Numbers displayed in cleartext on screens, receipts, or logs
severity = critical
search = index=* sourcetype=access_logs OR sourcetype=application_logs dest_zone="cde" | where match(log_content, "(?i)(\\b4[0-9]{12}(?:[0-9]{3})?\\b|\\b5[1-5][0-9]{14}\\b|\\b3[47][0-9]{13}\\b|\\b6(?:011|5[0-9]{2})[0-9]{12}\\b)") AND NOT match(log_content, "(?i)(masked|truncated|tokenized|\\*{8,12})") | stats count, values(dest_host) as hosts by rule_id
sourcetype = access_logs,application_logs
action = email
references = PCI-033
mitre = T1213
compliance = PCI-DSS-3.3
risk_score = 90

[SPL-PCI-034]
name = PCI-DSS 3.5 — Encryption Key Storage in Cleartext
description = Detects encryption keys stored in cleartext or improperly protected within the Cardholder Data Environment
severity = critical
search = index=* sourcetype=file_monitor dest_zone="cde" | where match(file_content, "(?i)(-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----|private.{0,10}key.{0,10}=.{0,100}|encryption.{0,10}key.{0,10}=.{0,100})") AND file_permissions NOT IN ("0400","0600") | stats count, values(dest_host) as hosts, values(file_path) as files by rule_id
sourcetype = file_monitor,system_logs
action = email
references = PCI-034
mitre = T1552.001
compliance = PCI-DSS-3.5
risk_score = 90

[SPL-PCI-035]
name = PCI-DSS 8.2 — Credential Reuse Across CDE Systems
description = Detects the same password or credential used across multiple CDE systems
severity = high
search = index=* sourcetype=auth_logs dest_zone="cde" action=authentication success | stats dc(dest_host) as system_count by user password_hash | where system_count > 1 | stats count, values(user) as users by rule_id
sourcetype = auth_logs,iam_logs
action = email
references = PCI-035
mitre = T1078
compliance = PCI-DSS-8.2
risk_score = 70