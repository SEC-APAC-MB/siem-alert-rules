[SPL-WSTG07-001]
name = SQL Injection Attack Detected
description = Detects SQL injection patterns in HTTP requests including UNION SELECT, OR 1=1, and comment-based injection
severity = critical
search = index=* ("input-validation" OR "sql-injection" OR "injection") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = WSTG07-001
mitre = T1190
compliance = PCI-DSS-6.5,NIST-SI-10
risk_score = 90

