# =============================================================================
# Splunk SIEM Alert Rules — api-security
# =============================================================================

[SPL-API-001]
name = API1: Broken Object Level Authorization (BOLA)
description = Detects sequential or unauthorized access to API objects by ID indicating broken object-level authorization
severity = critical
search = index=* ("bola" OR "idor" OR "authorization") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = API-001
mitre = T1078
compliance = API1-001,PCI-DSS-8.5
risk_score = 90

