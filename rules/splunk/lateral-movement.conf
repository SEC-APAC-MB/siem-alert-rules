# =============================================================================
# Splunk SIEM Alert Rules — lateral-movement
# =============================================================================

[SPL-LM-001]
name = Pass-the-Hash Detection
description = Detects NTLM pass-the-hash attacks where an adversary uses a password hash instead of plaintext password
severity = critical
search = index=* ("pass-the-hash" OR "windows") | stats count, values(src_ip) as src_ips, values(dest_ip) as dest_ips by rule_id, rule_name | where count > 5
sourcetype = access_logs,auth_logs,firewall
action = email
references = LM-001
mitre = T1550.002
compliance = PCI-DSS-8.5,NIST-IA-2
risk_score = 90

